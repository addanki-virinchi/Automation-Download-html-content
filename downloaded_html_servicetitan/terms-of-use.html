 Terms of Use and agree to use the Service in compliance with these Terms of Use. If you are registering for an account or using the Service on behalf of an entity, organization, or company (“<span class="bold"><b>Corporate Entity</b></span>”), you agree to the Agreement on behalf of that Corporate Entity and you represent and warrant to ServiceTitan that you have the authority to bind that Corporate Entity to the Agreement (and, in which case, the terms “Customer”, “you” and “your” will refer to that Corporate Entity).&nbsp; If you are not registering for an account or using the Service on behalf of a Corporate Entity or if you are registered for an account or using the Service as an Authorized User of a Corporate Entity, then the terms “Customer”, “you” and “your” will refer to you in your individual capacity. The terms “ServiceTitan,” “we,” “us,” and “our” refer to ServiceTitan and our Affiliates, as applicable. ServiceTitan’s direct competitors (or third-party agents acting on behalf of such direct competitors) are prohibited from accessing the Service.&nbsp;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">We may periodically make changes to these Terms of Use, and if we do we will post the changes on this page and will indicate at the top of this page the date these Terms of Use were last updated. You may view the most current version at <u>https://www.servicetitan.com/legal/terms-of-use</u>. We will also give you not less than thirty (30) days advance notice of any material changes, unless such material changes result from changes in laws, regulations, or requirements from telecommunications or other providers. Following such notice, your continued use of the Service on or after the date the updated version of these Terms of Use is&nbsp; effective and binding constitutes your acceptance of the updated version of these Terms of Use. The updated version of these Terms of Use supersedes all prior versions.&nbsp; If you do not agree to the updated version of these Terms of Use, you must stop using the Service immediately.&nbsp; You should periodically visit this page to review the current version of these Terms of Use so you are aware of any revisions. If you do not agree to abide by this Agreement, you will not access, browse, or use the Service.&nbsp;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">THESE TERMS OF USE CONTAINS AN ARBITRATION AGREEMENT, WHICH WILL, WITH LIMITED EXCEPTION, REQUIRE CUSTOMER TO SUBMIT CLAIMS CUSTOMER HAS AGAINST SERVICETITAN TO BINDING AND FINAL ARBITRATION, AND WAIVES EACH PARTY’S RIGHT TO A TRIAL BY JURY OR TO PARTICIPATE IN ANY CLASS ACTION OR REPRESENTATIVE PROCEEDING. UNDER THE ARBITRATION AGREEMENT, (1) CUSTOMER WILL ONLY BE PERMITTED TO PURSUE CLAIMS AGAINST SERVICETITAN ON AN INDIVIDUAL BASIS, NOT AS A PLAINTIFF OR CLASS MEMBER IN ANY CLASS OR REPRESENTATIVE ACTION OR PROCEEDING, AND (2) CUSTOMER WILL ONLY BE PERMITTED TO SEEK RELIEF (INCLUDING MONETARY, INJUNCTIVE, AND DECLARATORY RELIEF) ON AN INDIVIDUAL BASIS.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><span class="bold"><b><span class="bold"><em>Additional Terms:</em></span></b></span> When using certain features or functionality of the Service, you will be subject to any additional terms applicable to such features that may be appended to the Agreement or posted on or within the Service from time to time, including without limitation our Privacy Policy (as described in Section 24 below) and any user specifications regarding Authorized Users referenced herein from time to time (the “<span class="bold"><b>User Specifications</b></span>”). All such terms are hereby incorporated by reference into the Agreement. We may amend the User Specifications from time to time without amendment of the Agreement generally for the addition of new user types or changes to the features, functionality and roles applicable to individual user types.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><span class="bold"><b>1.</b></span>&nbsp; <span class="bold"><b>Account Registration</b></span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(a) Accounts; Authorized Users</u>. You must register for and maintain an account with us to use the Service. When registering, you must provide accurate and complete information and promptly update this information. If you provide any information that is inaccurate or incomplete, or we have reason to believe that the information is inaccurate or incomplete, we may suspend or terminate your account and your use of the Service. Only your employees or contractors who are authorized to access the Service using a user identifier and password provided to you by us or set up by you (“<span class="bold"><b>Authorized Users</b></span>”) may use your account to access and use the Service and conduct other activities with us. You are responsible for all activities that occur through your account. To protect your account from unauthorized use, you must keep your user identification and password and those of your Authorized Users secure. You must notify us immediately of any unauthorized use of your account or any other breach of security. If there is unauthorized use by anyone who obtained access to the Service directly or indirectly through you, you will take all steps reasonably necessary to terminate the unauthorized use. You will cooperate and assist with any actions taken by ServiceTitan to prevent or terminate unauthorized use of the Service. Certain features or functionality of the Service may only be accessed or used by a certain type of Authorized User and access to such features and functionality may be subject to specific Authorized User limits set forth in the agreement, order form or other document executed by you and us into which the Agreement is incorporated. See the User Specifications for more information. We reserve the right to prevent or limit usage of the Service in excess of such limits.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(b) Eligibility</u>. You must be at least the age of majority in the jurisdiction in which you live (which in most jurisdictions is either 18 or 19 years of age) to use the Service. By entering into the Agreement, you represent and warrant to us that: (i) you are at least the age of majority in the jurisdiction in which you live; (ii) you have not previously been suspended or removed from the Service; and (iii) your registration and your use of the Service is in compliance with any and all applicable laws and regulations.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(c) Corporate Entities</u>. If you are a Corporate Entity, you may allow Authorized Users working for your Affiliates to use the Service under your subscription to the Service, as long as the aggregate number of each type of Authorized User does not exceed those specified with respect to your subscription and as long as used in the operation of a single business. You agree that: (i) you will at all times be liable and responsible for all acts and omissions of your Authorized Users that use the Service (including any Authorized Users using the Service on behalf of your Affiliate) as though those acts and omissions were committed by you; and (ii) you agree (and you agree on behalf of your Affiliates) that your Affiliates and their Authorized Users may have access to the data and information accessible by their respective user types and ServiceTitan is not responsible for enforcing any data access restrictions between you and your Affiliates. “<span class="bold"><b>Affiliate</b></span>” means any entity that, directly or indirectly, through one or more intermediaries, ServiceTitan or Customer (as applicable) controls, by way of majority voting stock ownership or the ability to otherwise direct or cause the direction of the management and policies. If you registered for the Service under a name other than the legal name of a business, we may from time to time require you to verify that all licenses purchased by you are used only by you and your Affiliates and in the operation of a single business. If an Authorized User is using the Service in connection with the operation of more than one business, you must disclose this fact to us at the time of registration and renewal for the Service, as separate businesses require separate agreements with us. Failure to do so will constitute a breach of your obligations hereunder.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(d) User Specifications</u>. As used in the Agreement:&nbsp;</p><ul><li><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">a "<span class="bold"><b>Field User</b></span>" means a natural person affiliated or associated with your business or under the direction of your business who: (i) is assigned sole or primary responsibility for performing a customer job by themselves, (ii) who functions in a leadership role for an install crew, and/or (iii) to whom or to whose activities revenue can otherwise be attributed.&nbsp; Any individual that is assigned to a Field User subscription cannot be unassigned: (x) before the end of the subscription period in which they were so assigned and (y) without the written approval of ServiceTitan. You may not, and you must ensure that your Field Users do not, share accounts with each other or any other individuals. You are responsible for ensuring that your Field Users (and anyone else using your accounts or the accounts of your Field Users) comply with the terms of the Agreement. Deactivation of an individual assigned to Field User subscription will result in such individual being unassigned from all jobs and removed from reporting functionality. Field User subscription types include, without limitation, Managed Technicians and Managed Installers.&nbsp;</p></li><li><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">“<span class="bold"><b>Administrative User</b></span>” means a natural person affiliated or associated with your business or under the direction of your business who provides administrative or office support for a Field User and (i) who is not assigned sole or primary responsibility for performing a customer job by themselves, (ii) who does not function in a leadership role for an install crew or (iii) whose activities are not primarily responsible for generating revenue. Common examples of Administrative Users include Office Users, dispatchers, schedulers, call center users, business managers, account managers, sales representatives, customer support users and fleet operations personnel.&nbsp;</p></li><li><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">“<span class="bold"><b>Office User</b></span>” means an Administrative User who is primarily responsible for the assistance of Field Users with correspondence, record keeping, making of appointments, and other similar administrative tasks.&nbsp;</p></li></ul><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">Administrative User types may be included in subscription packages in specified quantities at no additional charge.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><span class="bold"><b>2.</b></span>&nbsp; <span class="bold"><b>Services</b></span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(a) Services</u>. Subject to your complete and ongoing compliance with the terms and conditions of the Agreement and the terms of your subscription for the Service, ServiceTitan hereby grants to you a limited, worldwide, non-exclusive, non-transferable, non-sublicensable right during the term of the Agreement to: (i) access and use the Service solely in connection with the internal business operations of a single business, and (ii) solely to facilitate the provision of the Service to you, download, install and use object code copies of any Mobile App(s) associated with the Service obtained from a legitimate marketplace (whether installed by you or pre-installed on your mobile device by the device manufacturer) on mobile devices that you own or control, in each case solely for use by a number of Authorized Users that does not exceed the number of paid subscriptions in your account, with no substitution of such users except as expressly permitted herein and approved by ServiceTitan in writing. Each instance of the Agreement that you agree to in connection with downloading a Mobile App grants you the aforementioned rights in connection with the installation and use of the Mobile App on one device. By way of example only, if you have 10 employees in your company, and if you have only paid for 3 Field Users (a type of Authorized User) subscriptions and you have only paid for 5 Administrative Users (another type of Authorized User), you are limited under this section for 3 individuals to access the Service as Field users, and for 5 individuals to access the Services as Administrative Users, without substitution. Certain features and functionality of the Service may be limited by number of transactions instead of number of Authorized Users, and you acknowledge and agree that after completing the number of transactions for which you have paid, such features and functionality may not be available to you unless and until you pay for additional transactions to be completed thereunder. Use of the Service by any number of individuals above the numbers provided by your subscription is a violation of the Agreement. Any number of individuals using the Service in excess of the number specified in your subscription will be subject to immediate additional subscription purchases to the payment method on file, prorated for any partial period. Further, if ServiceTitan provides you with any application programming interface (“<span class="bold"><b>API</b></span>”) or software outside the Service (“<span class="bold"><b>Ancillary Software</b></span>”, and together with the Service (including any Early Access Service), our website(s), and Mobile Apps, “<span class="bold"><b>ServiceTitan Technology</b></span>”), ServiceTitan hereby grants you a limited, non-exclusive, non-transferable, non-sublicensable right to use that Ancillary Software solely in connection with your use of the Service. Your use of Ancillary Software may be subject to additional terms and conditions.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(b) Early Access</u>. If you obtain a subscription to a new feature or add-on to the Service designated by us as “Preview,” “Alpha,” “Beta,” “Early Access” or “Evaluation Services” (each, an “<span class="bold"><b>Early Access Service</b></span>”), notwithstanding any other terms to the contrary, you may use such Early Access Service only for your internal demonstration, test, or evaluation purposes. Early Access Services and all documentation and information provided by ServiceTitan in connection therewith constitute ServiceTitan Confidential Information. You agree to provide feedback with respect to any Early Access Service that we make available to you, and the intellectual property rights in or related to such feedback are as set out in Section 9. NOTWITHSTANDING ANY TERMS TO THE CONTRARY IN THE AGREEMENT AND TO THE MAXIMUM EXTENT PERMITTED BY APPLICABLE LAW, WE DISCLAIM ALL REPRESENTATIONS, WARRANTIES, CONDITIONS, GUARANTEES AND OTHER KINDS OF PROMISES, EXPRESS, IMPLIED, OR STATUTORY FOR EARLY ACCESS SERVICES AND THEY ARE PROVIDED ON AN “AS IS” AND “AS AVAILABLE” BASIS. EARLY ACCESS SERVICES HAVE A NON-PERPETUAL, TIME-LIMITED SUBSCRIPTION TERM AND WE MAY “TIME-OUT” AND DISABLE THE EARLY ACCESS SERVICES OR OTHERWISE DISCONTINUE YOUR ACCESS AND USE OF THE EARLY ACCESS SERVICES AT ANY TIME AND FOR ANY REASON WITHOUT PRIOR NOTICE. You will not attempt to defeat or circumvent any duration mechanism for the Early Access Service and will not use any Early Access Service beyond the prescribed term of early access. Your use of an Early Access Service may be subject to additional terms and conditions that you must agree to when accessing the Early Access Service.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(c) Open-Source Software</u>. ServiceTitan Technology may contain or be provided together with open-source software. Each item of open-source software is subject to its own license terms. Copyrights to the open-source software are held by the respective copyright holders indicated therein.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(d) Artificial Intelligence</u>. From time to time, we may introduce features and capabilities as part of the Service that utilize artificial intelligence, machine learning, or similar technologies (the “<span class="bold"><b>AI Tools</b></span>”). While ServiceTitan uses commercially reasonable efforts to reduce errors and omissions arising from use of AI Tools, ServiceTitan makes no warranties, express or implied, regarding the accuracy, reliability or non-infringement of the AI Tools (including without limitation any and all outputs therefrom) and disclaims any liability for errors, actions or omissions&nbsp; based on the AI Tools or your use thereof.&nbsp; Any content generated by AI Tools is not reviewed by ServiceTitan and you are solely responsible for reviewing such content for purposes of accuracy before publishing or utilizing such content. In addition, in certain jurisdictions, notice and/or consent may be required from the downstream individual in the event AI Tools are used in connection with the processing of “personal information”, “personal data” or otherwise. In the event that any consents or notices are required, you agree and acknowledge that you are solely responsible for providing all required consents or notices with respect to the Service (including use of AI Tools).&nbsp;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><span class="bold"><b>3.</b></span>&nbsp; <span class="bold"><b>Support</b></span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">If you are current with payment of Service fees, and subject to any other agreement you may have for support for the Service, ServiceTitan will provide you with its standard technical support services relating to the Service, subject to ServiceTitan’s published support policies.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><span class="bold"><b>4.&nbsp; Fees and Payment</b></span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(a) General Payment Terms</u>. Certain features of the Service may require you to pay fees, including all applicable taxes. Such fees may differ based on the specific features and functionality of the Service you subscribe to and the number of Authorized Users or transactions for which you purchase subscriptions with respect to such features and functionality. In addition, some Service features and functionality may require us to engage third-party service providers (e.g., telecom providers) and you agree that any charges imposed on us by such third parties with respect to your usage or the provision of the Service to you (e.g., per-message/SMS fees, regulatory fees or access charges) may be passed through to you. You will have an opportunity to review the fees that you are charged. Unless otherwise agreed in writing, all fees are in U.S. Dollars and are non-refundable. &nbsp; Payments made by credit card, where permitted by ServiceTitan, may be subject to transaction, surcharge, and other processing fees and such fees are subject to change from time to time. &nbsp;ServiceTitan reserves the right to change the required method of payment at any time, upon notice to you (including in any invoice). You are responsible for updating your account information pursuant to written instructions provided by ServiceTitan should the required payment method change, and you agree to execute, within 10 business days of our request, any additional authorizations reasonably required in order to effect such change. If you agreed to purchase a minimum number of Authorized User subscriptions as part of registering for certain features and functionality of the Services (the “<span class="bold"><b>Minimum Subscription Level</b></span>”), you must pay for at least that number of subscriptions during the applicable subscription term with respect to such features and functionality. Additional subscriptions may be purchased at the same pricing during the subscription term, with fees prorated for partial months, and you may make adjustments in the actual number of subscriptions from time to time, provided that you must always purchase a number of subscriptions equal to or greater than the Minimum Subscription Level. Monthly billing will be based upon the number of subscriptions at the beginning of the period, plus prorated billing for any added subscriptions and without reduction for subscriptions removed during the period. ServiceTitan reserves the right to shift the dates of your billing periods from time to time. If you are not subject to a Minimum Subscription Level, you must at all times maintain at least one (1) active Field User subscription. All fees paid hereunder are non-refundable and non-recoupable. You agree that your purchases under the Agreement are neither contingent on the delivery of any future functionality or features of the Service nor dependent on any oral or written public comments made by us regarding future functionality or features.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(b) Price</u>. ServiceTitan reserves the right to determine pricing for the Service. Except as otherwise specified in a written agreement or order form between you and ServiceTitan that incorporates these Terms of Use by reference, ServiceTitan may change the fees for any feature of the Service, including additional fees or charges, if ServiceTitan gives you not less than thirty (30) days’ advance notice of such changes via email or electronic notification within the Service before they apply. Without limiting the generality of the foregoing, if you are not subject to a Minimum Subscription Level, ServiceTitan may elect to increase your pricing if your Field User subscription count decreases over time. ServiceTitan, in its sole discretion, may make promotional offers with different features and different pricing to any of ServiceTitan’s customers. These promotional offers, unless made to you, will not apply to your offer or the Agreement.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(c) Additional Amounts Payable</u>. We may process automatically recurring payments for periodic charges on additional services and individual charges as incurred or batch them from time to time. If you activate an additional service (e.g., a ServiceTitan Pro Product or Add-On subscription) or incur usage fees (e.g., direct mail fees per piece), you hereby authorize ServiceTitan to periodically charge such fees, including on a going-forward basis and until cancellation of either the recurring payments or your account, and all other accrued sums on or before the payment due date for the accrued sums. All fees and taxes applicable to each such additional subscription will be charged automatically to your account for each subscription billing period. The subscription will continue unless and until you cancel the additional subscription or we terminate it. You must cancel a subscription before it renews in order to avoid being charged the next periodic subscription fee to your account. You may request cancellation of a subscription service by contacting us at: <a data-optimizely="hyperlink" href="mailto:billing@servicetitan.com" target="_blank" rel="noopener noreferrer">billing@servicetitan.com</a>. ServiceTitan may make available for activation by you and your Authorized Users within ServiceTitan Technology certain subscription services that would be new to your account (as well as the capability to purchase certain hardware) and you represent, warrant, covenant, and agree that the individual designated by ServiceTitan as the primary contact for your account, as well as any and all individuals with the “General Manager” or “Business Owner” designation under your account within ServiceTitan Technology are authorized to bind you to the applicable terms and conditions for such additional subscription services and purchases, and you hereby agree to pay all applicable fees and charges with respect thereto.&nbsp;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(d) Taxes and Charges.</u>&nbsp;&nbsp;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">i. ServiceTitan may be required to charge sales or other tax on products and services pursuant to certain foreign, federal, state, provincial and local laws, and may pass through regulatory, access, or usage fees or charges.&nbsp; Estimated or final taxes along with applicable fees and charges are not included in the Service fees charged under the Agreement and shall be borne by Customer. Your invoice will reflect the final taxes, fees, and charges in effect at the time of invoicing based on the address for the business(es). Customer must claim any exemption for all applicable taxes, fees, or charges at the time of purchase and provide any/all exemption certifications and email documentation to <a data-optimizely="hyperlink" href="mailto:taxinquiry@servicetitan.com" target="_blank" rel="noopener noreferrer">taxinquiry@servicetitan.com</a>. ServiceTitan reserves the right to determine the applicability of any claimed exemptions, and any disputes over exemptions shall be subject to the dispute resolution provisions of these Terms of Use.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">ii. Customer is solely responsible for determining, collecting, withholding, reporting, and remitting applicable taxes, duties, fees, surcharges and additional charges that arise from any sale of Customer’s products or services to Customer’s clients (“<span class="bold"><b>End Clients</b></span>") and any other business transactions between Customer and End Clients using the Service. Any contract of sale made through the Service is directly between Customer and the End Client.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(e) Delinquent Accounts</u>. ServiceTitan may, without notice, suspend or terminate access to the Service, including fee-based portions of the Service, for any account for which any amount is due but unpaid. In addition to the amount due for the Service, a delinquent account will be charged with fees, charges or expenses (including attorneys’ fees) that are incidental to any chargeback or collection of any unpaid amount, including collection fees. Further, amounts invoiced by ServiceTitan but not paid by the applicable due date may incur interest at the rate which is the lesser of (i) 1.5% per month, calculated daily, and compounded monthly, and (ii) the highest rate permitted under applicable law.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(f) Other Agreements with ServiceTitan</u>. To the extent that you or your Affiliates have other agreements in place with ServiceTitan or its Affiliates, you acknowledge and agree that, notwithstanding the terms of such other agreements, or the original authorization(s) provided to ServiceTitan to process payment thereunder via ACH, credit card, or otherwise, you, on behalf of yourself and your Affiliates, hereby authorize ServiceTitan to any time upon prior notice to you (email acceptable) migrate payment of any or all amounts due and payable to ServiceTitan or its Affiliates under any or all of those other agreements to the payment method in place under the Agreement or any other agreement you have in place with ServiceTitan or its Affiliates.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><span class="bold"><b>5.</b></span>&nbsp; <span class="bold"><b>Term and Termination</b></span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(a) Term</u>. The term of the Agreement commences upon your registration for a Service subscription (whether via entering into an Order Form or other written agreement that incorporates these Terms of Use, or otherwise) and remains in effect for the term of your subscription. If you have entered into an order form or other written agreement that incorporates these Terms of Use, the term is specified therein; if these Terms of Use are the only agreement between you and ServiceTitan with respect to your Service subscriptions, such subscriptions are month-to-month and will automatically renew for additional successive monthly terms unless either party provides not less than thirty (30) days written notice of nonrenewal to the other party prior to the renewal date. Notice via email to ServiceTitan at<u> billing@servicetitan.com</u> will be deemed sufficient. Upon termination, your access to the Service and any information stored by the Service will also terminate.&nbsp;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(b) Suspension</u>. You agree to refrain from the following actions (which each constitute a material breach of the Agreement) and we may immediately, without notice, suspend your access to the Service if: (i) you breach any provision of the Agreement; (ii) you seek to hack the security mechanisms of the Service or we otherwise determine that your use of the Service poses a security risk to us or to another user of the Service; (iii) you introduce a malicious program into the network or a virtual machine instance; (iv) you cause network interference that affects Service performance for other customers; (v) you use the Service in a way that we determine, in our sole discretion, is abusive or disrupts or threatens the performance or availability of the Service; or (vi) we receive notice or we otherwise determine, in our sole discretion, that you may be using the Service for an illegal purpose or in a way that violates the law or violates, infringes, or misappropriates the rights of any third party. Your access will be restored only if and when the reason for the suspension is resolved.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(c) Early Termination</u>: <span class="bold"><b>If you want to terminate the Agreement before the term of the Agreement is over, you will owe a termination fee equal to all the remaining payments and you and we agree that the termination fee is based on an agreed minimum usage commitment by you and is not a penalty.</b></span> The only exception is that you may terminate with thirty (30) days' written notice if ServiceTitan materially breaches the Agreement and does not cure the breach within thirty (30) days' of receiving your written notice. Further, a party may terminate the Agreement upon written notice if the other party ceases to do business, becomes insolvent, goes or is put into receivership or liquidation, passes a resolution for its winding up or for any of the foregoing, makes an arrangement for the benefit of its creditors, enters into bankruptcy, moratorium, or any other proceeding that relates to insolvency or protection of creditors’ rights.&nbsp;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(d) Effect of Termination</u>. If the Agreement is terminated for any reason: (i) you will pay to ServiceTitan any fees or other amounts that have accrued prior to the effective date of the termination; (ii) any and all liabilities accrued prior to the effective date of the termination will survive; and (iii) the following sections&nbsp; of these Terms of Use will survive: Sections 5, 7, 8, 9 and 11 through 32 and Attachment 1 hereto.&nbsp;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(e) Customer Data and Export Period</u>.&nbsp; For the purposes of the Agreement “<span class="bold"><b>Customer Data</b></span>” means electronic data or information or business data submitted to the Service by Customer or any Authorized User or directly created by any such person for Customer’s use in connection with the use of the Service, including without limitation User Data (as defined below). Notwithstanding the foregoing, Customer Data does not include non-identifiable aggregated data compiled by ServiceTitan in connection with Customer’s (including its Authorized Users’) use of the Service. Following termination and upon Customer’s request and subject to any specific restrictions applicable to Customer or Customer’s data, ServiceTitan will make commercially reasonable efforts to export and provide to Customer in electronic format the Customer Data in Customer’s account (service fees may apply). ServiceTitan makes no representation as to the integrity, completeness or timeliness of any data so exported, and ServiceTitan is not obligated to retain that information for greater than 60 days after any termination (“Export Period”). After such Export Period and subject to ServiceTitan’s legal obligations with respect to access and rectification of personal information, ServiceTitan has no obligation to maintain or provide any Customer Data and shall be entitled to, except to the extent legally prohibited, delete Customer Data by deleting Customer’s account; provided, however, that ServiceTitan will not be required to remove copies of the Customer Data from its backup media and servers until such time as the backup copies are scheduled to be deleted, provided further that in all cases ServiceTitan will continue to protect the Customer Data in accordance with the Agreement. Customer Data will be made available to authorized points of contact in a Microsoft SQL server backup format (.BAK), standard Microsoft Tape Format (.MTF), or such other format as determined by ServiceTitan. For clarity, during the term of the Agreement, Customer may extract Customer Data using ServiceTitan’s standard web services.&nbsp;&nbsp;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><span class="bold"><b>6.</b></span>&nbsp; <span class="bold"><b>Access to the Service; Modifications to the Service</b></span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">We do not provide you with the equipment to access the Service. You are responsible for all fees charged by third parties to access the Service (e.g., Internet and/or mobile access charges). You agree and acknowledge that ServiceTitan may update and otherwise change the Service from time to time in its sole discretion at any time, provided that such modifications do not materially degrade any of the functionality or features of the Service to which you have subscribed. Notwithstanding the foregoing, we reserve the right to modify or discontinue, temporarily or permanently, all or a part of the Service without notice and we will not be liable to you or to any third party for any modification, suspension, or discontinuance of the Service, except that if we permanently discontinue the Service we will provide you, as your sole and exclusive remedy, and our sole and exclusive liability, a pro-rated refund representing the unused (as of the date of termina ormation and an effective unsubscribe mechanism, to the extent required. Except as may be expressly permitted by applicable law or authorized by us in writing, you will not, and will not permit anyone else to:</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">&nbsp;a. &nbsp; &nbsp; 	use ServiceTitan Technology in violation of the Agreement, for any illegal purpose or in violation of any local, state, provincial, national, or international law;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">b. &nbsp; &nbsp; 	harass, threaten, demean, embarrass, or otherwise harm any other user of the Service;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">c.&nbsp; &nbsp; &nbsp; 	violate, or encourage others to violate, any right of a third party, including without limitation by infringing or misappropriating any third party intellectual property right;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">d. &nbsp; &nbsp; 	use ServiceTitan Technology in violation of any applicable advertising and marketing laws such as CAN-SPAM, the TCPA, the FTC’s Telemarketing Sales Rule, Canada’s Anti-Spam Legislation (CASL), the telemarketing provisions of the Canadian Competition Act, the CRTC Unsolicited Telecommunications Rules, California Invasion of Privacy Act and other applicable state and federal wiretapping laws, and all other applicable laws, rules, and regulations, including those relating to the collection of debts from consumers. You acknowledge that you are familiar with, and agree to comply with, restrictions that may apply to (without limitation) (i) permitted contact times; (ii) customers’ consent to be contacted by telephone, email and/or text messages (including opt in/opt out consent where applicable and maintenance and use of do not call lists); (iii) the required content of emails and text messages and requirements for enabling and promptly implementing unsubscribe requests; (iv) any registration requirements relating to do not call lists; (v) any notices that need to be given to potential customers during telephone calls; and (vi) CTIA’s Messaging Principles and Best Practices;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">e. &nbsp; &nbsp; 	import or transfer to ServiceTitan or the ServiceTitan Technology any data that is sensitive financial information (including credit card numbers), health information, medical information, pharmaceutical information, any personal information whatsoever about or regarding children under 18 years of age, or other sensitive or regulated information (for example, Social Security Numbers or Social Insurance Numbers);</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">f.&nbsp; &nbsp; &nbsp; 	interfere with security-related features of ServiceTitan Technology, including by: (i) disabling or circumventing features that prevent or limit use or copying of any content; or (ii) reverse engineering, disassembling, decompiling, or otherwise attempting to discover the source code of any portion of the ServiceTitan Technology except to the extent that the activity is expressly permitted by applicable law, and in such an instance you agree to provide us with prior written notice;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">g. &nbsp; &nbsp; 	interfere with the operation of ServiceTitan Technology or any user’s enjoyment of ServiceTitan Technology, including by: (i) uploading or otherwise disseminating any virus, adware, spyware, worm, or other malicious code; (ii) making any unsolicited offer or advertisement to another user of ServiceTitan Technology; (iii) collecting personal information about another user or third party without consent; or (iv) interfering with or disrupting any network, equipment, or server connected to or used to provide ServiceTitan Technology;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">h. &nbsp; &nbsp; 	perform any fraudulent activity including impersonating any person or entity, claiming a false affiliation, accessing any other Service account without permission, or falsifying your age or date of birth;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">i. &nbsp; &nbsp; &nbsp; 	license, sublicense, sell, resell, rent, lease, assign, distribute, time share, use the ServiceTitan Technology to operate a service bureau, otherwise transfer or make available to any third party the access granted under the Agreement or any right or ability to view, access, or use ServiceTitan Technology, or otherwise commercially exploit the ServiceTitan Technology in violation of the Agreement;&nbsp;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riM rior consent of the applicable franchisor.&nbsp;<br><br><span class="bold"><b>11. Confidentiality</b></span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(a) &nbsp; Definition of Confidential Information.</u> “<span class="bold"><b>Confidential Information</b></span>” means all information disclosed by a party (“<span class="bold"><b>Disclosing Party</b></span>”) to the other party (“<span class="bold"><b>Receiving Party</b></span>”), whether orally or in writing, that is designated as confidential or that reasonably should be understood to be confidential given the nature of the information and the circumstances of disclosure. Your Confidential Information includes non-public information or material you upload to the Service (including Customer Data). The Confidential Information of ServiceTitan includes ServiceTitan Technology and the terms and conditions of all customer success agreements, service orders, order forms, purchase orders and other ordering documentation (including pricing) and the proprietary materials provided to Customer in the course of Customer's implementation, including, but not limited to, guides, product descriptions and configuration tools (the "<span class="bold"><b>Materials</b></span>").&nbsp; The Materials are confidential and proprietary to ServiceTitan and Customer may only use them solely for the purpose of transitioning to and implementing the Service.&nbsp; Confidential Information of each party includes business and marketing plans, technology and technical information, product plans and designs, and business processes disclosed by such party. However, Confidential Information does not include any information that (i) is or becomes generally known to the public without breach of any obligation owed to the Disclosing Party, (ii) was known to the Receiving Party prior to its disclosure by the Disclosing Party without breach of any obligation owed to the Disclosing Party, (iii) is received from a third party without breach of any obligation owed to the Disclosing Party, or (iv) was independently developed by the Receiving Party without use of or reference to the Disclosing Party’s Confidential Information.<br><br><u>(b) &nbsp; Non-Use and Non-Disclosure of Confidential Information.</u><span class="bold"><b> </b></span>Except as set forth in the Agreement, or with respect to ServiceTitan, the Privacy Policy, Receiving Party will not use any Confidential Information for any purpose except to perform its obligations or exercise its rights under the Agreement. Subject to ServiceTitan’s rights under Sections 10, 17, and 18, ServiceTitan will not disclose your Confidential Information to any third party without your consent. This includes information about the pricing of the products and services that you might sell and promote through the Service. ServiceTitan may, however, disclose your Confidential Information if required by law or if ServiceTitan reasonably determines that disclosure is necessary to prevent harm to ServiceTitan or any third party. Your consent to disclosure shall be deemed given in the event that you access ServiceTitan or your ServiceTitan data through a third party application, solely with respect to disclosure in connection with your use of such third party application. If ServiceTitan is required by law to disclose any of that information or material, ServiceTitan will, to the extent permitted by law, court order, or applicable legal process, make reasonable efforts to provide you prompt written notice of that requirement prior to disclosure. Further, if you register for the Service through a referral or other promotional partner or through an industry or trade group with whom we have a commercial relationship, we may disclose information about your account to that referral partner or industry group in connection with that commercial relationship. For the avoidance of doubt, except to the extent required for compliance with applicable law, ServiceTitan will not directly contact your customers (other than in the ordinary course of business not related to the Agreement) or make personally identifying or contact data regarding your customers available to any third party without your consent. Such consent will be deemed given, however, in the event that you access the Service or your ServiceTitan data through a third party application, solely with respect to disclosure in connection with your use of such third party application.&nbsp;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(c)&nbsp; &nbsp; Protection of Confidential Information</u>. Receiving Party shall take reasonable measures to protect the secrecy of and avoid unauthorized disclosure and use of the Confidential Information of Disclosing Party. Without limiting the foregoing, Receiving Party shall take at least those measures that it employs to protect its own Confidential Information of a similar nature (but in no event less than a commercially reasonable standard of care) and shall ensure that its representatives (“Representatives”) who have access to Confidential Information of Disclosing Party have signed a nonuse and nondisclosure agreement in content at least as protective of Disclosing Party’s Confidential Information as the provisions of the Agreement, prior to any disclosure of Confidential Information to such Representatives. The Receiving Party shall reproduce Disclosing Party’s proprietary rights notices on any copies made by the Receiving Party in the same manner in which such notices were set forth in or on the original Confidential Information.&nbsp;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" alignde
