rviceTitan Technology or any data (including without limitation the Customer Data), materials or information you provide to the Service; or (d) any dispute or issue between you and any third party, including but not limited to any expenses for chargebacks, fines or fees for which ServiceTitan becomes liable for as a result of your usage of ServiceTitan Payments™, except to the extent directly caused by any gross negligence or willful misconduct on the part of ServiceTitan or material defect with ServiceTitan Payments. We reserve the right, at our own expense, to assume the exclusive defense and control of any matter otherwise subject to indemnification by you (without limiting your indemnification obligations with respect to that matter), and in that case, you agree to cooperate with our defense of those claims. You will not settle or compromise any such claim without our prior written consent.&nbsp;&nbsp;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><span class="bold"><b>16.</b></span>&nbsp; <span class="bold"><b>Force Majeure</b></span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">A party shall neither be held liable or responsible to the other party, nor be deemed to have defaulted under or breached the Agreement, for failure or delay in fulfilling or performing any obligation hereunder (other than an obligation for the payment of money) to the extent, and for so long as, such failure or delay is caused by or results from causes beyond the reasonable control of such party including, but not limited to, fire, floods, embargoes, pandemics or epidemics, war, acts of war, riots, strikes, acts of God, or omissions or delays in acting by any governmental authority.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><span class="bold"><b>17.</b></span>&nbsp; <span class="bold"><b>Assignability</b></span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">You may not assign the Agreement or any right, duty, or obligation under the Agreement, without ServiceTitan’s prior written consent, including, for the avoidance of doubt, to any acquirer of your business. If consent is given, the Agreement will bind your successors and assigns. Any attempt by you to transfer any right, duty, or obligation under the Agreement except as expressly provided in the Agreement is void. ServiceTitan may assign the Agreement or any right, duty, or obligation under the Agreement at any time without your consent.&nbsp;&nbsp;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">In the event that Customer acquires other businesses or entities after the date of the Agreement, the employees and contractors of such businesses or entities may constitute Authorized Users under this Agreement only if such businesses are not ServiceTitan customers at the time of acquisition ("<span class="bold"><b>Non-ServiceTitan Acquisitions</b></span>"). In the event that Customer acquires other businesses or entities after the date of this Agreement that at the time of acquisition are ServiceTitan Customers (“<span class="bold"><b>ServiceTitan Acquisitions</b></span>”), all agreements between ServiceTitan and the ServiceTitan Acquisitions (including, but not limited to, agreements for core Managed Technician Licenses, Pricebook Pro, Marketing Pro, Phones Pro, professional services and/or other products or services) (“<span class="bold"><b>Acquired Entity Agreements</b></span>”) shall continue in full force and effect in accordance with their terms. Nothing in this Section 17 shall be construed to allow the terms of any Acquired Entity Agreement to be assigned to or applicable to Customer, its Affiliates or any other business or entity. Customer will provide prompt written notice to ServiceTitan in the event of any Non-ServiceTitan Acquisition or ServiceTitan Acquisition.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><span class="bold"><b>18.</b></span>&nbsp; <span class="bold"><b>Subcontractors</b></span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">ServiceTitan may utilize one or more subcontractors or other third parties to perform its duties under the Agreement so long as ServiceTitan remains responsible for all of its obligations under the Agreement.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><span class="bold"><b>19.</b></span>&nbsp; <span class="bold"><b>Notices</b></span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">Except as otherwise expressly set forth in the Agreement, any notice required or permitted to be given in accordance with the Agreement will be effective if it is in writing and sent by postal mail or insured courier (in each case with delivery confirmation), to the appropriate party at the address set forth below for ServiceTitan, and at the address set forth in your account for you, and with the appropriate postage affixed. Alternatively, ServiceTitan may transmit notices to you via email to the email address specified in your account. Either party may change its address for receipt of notice by notice to the other party in accordance with this Section. Notices are deemed given upon delivery to the designated address.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">ServiceTitan, Inc.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">Attn: Legal</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">800 N. Brand Blvd., Suite 100</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">Glendale, CA 91203</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><span class="bold"><b>20A.Dispute Resolution</b></span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><span class="bold"><b>IF YOU ENTERED INTO THE AGREEMENT PRIOR TO DECEMBER 7, 2022, OR YOUR ORDER FORM OR OTHER WRITTEN AGREEMENT WITH SERVICETITAN THAT INCORPORATES THESE TERMS OF USE HAS AN EFFECTIVE DATE PRIOR TO DECEMBER 7, 2022, THEN THIS SECTION 20A APPLIES. IF YOU ENTERED INTO THE AGREEMENT ON OR AFTER DECEMBER 7, 2022, OR YOUR ORDER FORM OR OTHER WRITTEN AGREEMENT WITH SERVICETITAN THAT INCORPORATES THESE TERMS OF USE HAS AN EFFECTIVE DATE ON OR AFTER DECEMBER 7, 2022, THEN SECTION 20B BELOW APPLIES IN LIEU OF THIS SECTION 20A.</b></span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><span class="bold"><b>PLEASE READ THIS SECTION CAREFULLY AS IT AFFECTS YOUR RIGHTS.</b></span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(a) Generally</u>. In the interest of resolving disputes between you and ServiceTitan in the most expedient and cost effective manner, and except as described in Sections 20A(b), (c) and (g), you and ServiceTitan agree that every dispute arising in connection with the Agreement will be resolved by binding arbitration. Arbitration is less formal than a lawsuit in court. Arbitration uses a neutral arbitrator instead of a judge or jury, may allow for more limited discovery than in court, and can be subject to very limited review by courts. Arbitrators can award the same damages and relief that a court can award. This agreement to arbitrate disputes includes all claims arising out of or relating to any aspect of the Agreement, whether based in contract, tort, statute, fraud, misrepresentation, or any other legal theory, and regardless of whether a claim arises during or after the termination of the Agreement. YOU UNDERSTAND AND AGREE THAT, BY ENTERING INTO THE AGREEMENT, YOU AND SERVICETITAN ARE EACH WAIVING THE RIGHT TO A TRIAL BY JURY OR TO PARTICIPATE IN A CLASS ACTION.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(b) Exceptions</u>. Despite the provisions of Section 20A(a), nothing in this Agreement will be deemed to waive, preclude, or otherwise limit the right of either party to: (i) bring an individual action in small claims court; (ii) pursue an enforcement action through the applicable federal, state, or local agency if that action is available; (iii) seek injunctive relief in a court of law in aid of arbitration; or (iv) to file suit in a court of law to address an intellectual property infringement claim.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(c) Opt-Out</u>. If you do not wish to resolve disputes by binding arbitration, you may opt out of the provisions of this Section 20A within 30 days after the date that you agree to the Agreement by sending a letter to ServiceTitan, Inc., 800 N. Brand Blvd., Suite 100, Glendale, CA 91203 that specifies: your full legal name, the email address associated with your account on the Service, and a statement that you wish to opt out of arbitration (“<span class="bold"><b>Opt-Out Notice</b></span>”). Once ServiceTitan receives your Opt-Out Notice, this Section 20A will be void and any action arising out of the Agreement will be resolved as set forth in Section 21. The remaining provisions of the Agreement will not be affected by your Opt-Out Notice.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(d) Arbitrator</u>. Any arbitration between you and ServiceTitan will be settled under the Federal Arbitration Act and administered by the American Arbitration Association (“<span class="bold"><b>AAA</b></span>”) under its Consumer Arbitration Rules (collectively, “<span class="bold"><b>AAA Rules</b></span>”) as modified by these Terms of Use. The AAA Rules and filing forms are available online at www.adr.org, by calling the AAA at 1-800-778-7879, or by contacting ServiceTitan. The arbitrator has exclusive authority to resolve any dispute relating to the interpretation, applicability, or enforceability of this binding arbitration agreement.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(e) Notice of Arbitration; Process</u>. A party who intends to seek arbitration must first send a written notice of the dispute to the other party by certified mail or by Federal Express (signature required) or, only if that other party has not provided a current physical address, then by electronic mail (“<span class="bold"><b>Notice of Arbitration</b></span>”). ServiceTitan’s address for Notice is: ServiceTitan, Inc., 800 N. Brand Blvd., Suite 100, Glendale, CA 91203. The Notice of Arbitration must: (i) describe the nature and basis of the claim or dispute; and (ii) set forth the specific relief sought (“<span class="bold"><b>Demand</b></span>”). The parties will make good faith efforts to resolve the claim directly, but if the parties do not reach an agreement to do so within 30 days after the Notice of Arbitration is received, you or ServiceTitan may commence an arbitration proceeding. All arbitration proceedings between the parties will be confidential unless otherwise agreed by the parties in writing. During the arbitration, the amount of any settlement offer made by you or ServiceTitan must not be disclosed to the arbitrator until after the arbitrator makes a final decision and award, if any. If the arbitrator awards you an amount higher than the last written settlement amount offered by ServiceTitan in settlement of the dispute prior to the award, ServiceTitan will pay to you the higher of: (A) the amount awarded by the arbitrator; or (B) $10,000.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(f) Fees</u>. If you commence arbitration in accordance with the Agreement, ServiceTitan will reimburse you for your payment of the filing fee, unless your claim is for more than $10,000, in which case the payment of any fees will be decided by the AAA Rules. Any arbitration hearing will take place at a location to be agreed upon in Los Angeles County, California, but if the claim is for $10,000 or less, you may choose whether the arbitration will be conducted: (i) solely on the basis of documents submitted to the arbitrator; (ii) through a non-appearance based telephone hearing; or (iii) by an in-person hearing as established by the AAA Rules in the county (or parish) of your billing address. If the arbitrator finds that either the substance of your claim or the relief sought in the Demand is frivolous or brought for an improper purpose (as measured by the standards set forth in Federal Rule of Civil Procedure 11(b)), then the payment of all fees will be governed by the AAA Rules. In that case, you agree to reimburse ServiceTitan for all monies previously disbursed by it that are otherwise your obligation to pay under the AAA Rules. Regardless of the manner in which the arbitration is conducted, the arbitrator must issue a reasoned written decision sufficient to explain the essential findings and conclusions on which the decision and award, if any, are based. The arbitrator may make rulings and resolve disputes as to the payment and reimbursement of fees or expenses at any time during the proceeding and upon request from either party made within 14 days of the arbitrator’s ruling on the merits.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(g) No Class Actions</u>. <span class="bold"><b>YOU AND SERVICETITAN AGREE THAT EACH MAY BRING CLAIMS AGAINST THE OTHER ONLY IN YOUR OR ITS INDIVIDUAL CAPACITY AND NOT AS A PLAINTIFF OR CLASS MEMBER IN ANY PURPORTED CLASS OR REPRESENTATIVE PROCEEDING. FURTHER, UNLESS BOTH YOU AND SERVICETITAN AGREE OTHERWISE, THE ARBITRATOR MAY NOT CONSOLIDATE MORE THAN ONE PERSON OR ENTITY’S CLAIMS, AND MAY NOT OTHERWISE PRESIDE OVER ANY FORM OF A REPRESENTATIVE OR CLASS PROCEEDING. ALSO, THE ARBITRATOR MAY AWARD RELIEF (INCLUDING MONETARY, INJUNCTIVE, AND DECLARATORY RELIEF) ONLY IN FAVOR OF THE INDIVIDUAL PARTY SEEKING RELIEF AND ONLY TO THE EXTENT NECESSARY TO PROVIDE RELIEF NECESSITATED BY THAT PARTY’S INDIVIDUAL CLAIM(S), EXCEPT THAT YOU MAY PURSUE A CLAIM FOR AND THE ARBITRATOR MAY AWARD PUBLIC INJUNCTIVE RELIEF UNDER APPLICABLE LAW TO THE EXTENT REQUIRED FOR THE ENFORCEABILITY OF THIS PROVISION.</b></span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(h) Modifications to this Arbitration Provision</u>. If ServiceTitan makes any future change to this arbitration provision, other than a change to ServiceTitan’s address for Notice of Arbitration, you may reject the change by sending us written notice within 30 days of the change to ServiceTitan’s address for Notice of Arbitration, in which case your account with ServiceTitan will be immediately terminated and this arbitration provision, as in effect immediately prior to the changes you rejected will survive.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(i) Enforceability</u>. If Section 20A(g) or the entirety of this Section 20A is prohibited by applicable law or found by a court of competent jurisdiction to be unenforceable, or if ServiceTitan receives an Opt-Out Notice from you, then the entirety of this Section 20A will be null and void and, in that case, the exclusive jurisdiction and venue described in Section 21 will govern any action arising out of or related to the Agreement.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><span class="bold"><b>20B. Arbitration Agreement</b></span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">IF YOU ENTERED INTO THE AGREEMENT ON OR AFTER DECEMBER 7, 2022, OR YOUR ORDER FORM OR OTHER WRITTEN AGREEMENT WITH SERVICETITAN THAT INCORPORATES THESE TERMS OF USE HAS AN EFFECTIVE DATE ON OR AFTER DECEMBER 7, 2022, THEN THIS SECTION 20B BELOW APPLIES IN LIEU OF SECTION 20A.<br><br>(a) <u>Agreement to Arbitrate</u>. This Section 20B is referred to as the “Arbitration Agreement.”&nbsp; Customer agrees that any and all disputes or claims that have arisen or may arise between Customer and ServiceTitan, whether arising out of or relating to the Agreement, shall be resolved exclusively through final and binding arbitration, rather than a court, in accordance with the terms of this Arbitration Agreement, except that Customer may assert individual claims in small claims court, if Customer’s claims qualify. Customer agrees that, by agreeing to this Arbitration Agreement, Customer and ServiceTitan are each waiving the right to a trial by jury or to participate in a class action. This Arbitration Agreement includes all claims arising out of or relating to any aspect of the Agreement, whether based in contract, tort, statute, fraud, misrepresentation, or any other legal theory, and regardless of whether a claim arises during or after the termination of the Agreement.&nbsp; Each party’s rights will be determined by a neutral arbitrator, not a judge or jury.&nbsp; The Federal Arbitration Act governs the interpretation and enforcement of this Arbitration Agreement.&nbsp; Notwithstanding the foregoing, this Arbitration Agreement shall not preclude either party from pursuing a court action for the sole purpose of obtaining a temporary restraining order or preliminary injunction in circumstances in which such relief is appropriate; provided that any other relief shall be pursued through an arbitration proceeding pursuant to this Arbitration Agreement.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">(b) <u>Prohibition of Class and Representative Actions and Non-Individualized Relief</u>. Customer and ServiceTitan agree that each may bring claims against the other only on an individual basis and not as plaintiff or class member in any purported class or representative action or proceeding. Unless both Customer and ServiceTitan agree otherwise, the arbitrator may not consolidate or join more than one person’s or party’s claims and may not otherwise preside over any form of a consolidated, representative, or class proceeding.&nbsp; Also, the arbitrator may award relief (including monetary, injunctive, and declaratory relief) only in favor of the individual party seeking relief and only to the extent necessary to provide relief necessitated by that party’s individual claim(s).&nbsp;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">(c) <u>Pre-Arbitration Dispute Resolution</u>. ServiceTitan is always interested in resolving disputes amicably and efficiently, and most participant concerns can be resolved quickly and to the participant’s satisfaction by emailing your designated ServiceTitan customer support team.&nbsp; If such efforts prove unsuccessful, a party who intends to seek arbitration must first send to the other, by certified mail, a written Notice of Dispute (“Notice”).&nbsp; The Notice to ServiceTitan should be sent to ServiceTitan, Inc., 800 N. Brand Blvd., Suite 100, Glendale, CA 91203, ATTN: Legal.&nbsp; The Notice must (i) describe the nature and basis of the claim or dispute and (ii) set forth the specific relief sought.&nbsp; If ServiceTitan and Customer do not resolve the claim within sixty (60) calendar days after the Notice is received, ServiceTitan or Customer may commence an arbitration proceeding.&nbsp; During the arbitration, the amount of any settlement offer made by ServiceTitan or Customer shall not be disclosed to the arbitrator until after the arbitrator determines the amount, if any, to which Customer or ServiceTitan is entitled.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">(d) <u>Arbitration Procedures</u>. Arbitration will be conducted by a neutral arbitrator in accordance with the American Arbitration Association’s (“AAA”) rules and procedures, including the AAA’s Commercial Arbitration Rules (collectively, the “AAA Rules”), as modified by this Arbitration Agreement. Any arbitration hearing will take place at a location to be agreed upon in Los Angeles County, CA; if the parties are unable to agree on a location within Los Angeles County, CA, the determination shall be made by AAA. If there is any inconsistency between any term of the AAA Rules and any term of this Arbitration Agreement, the applicable terms of this Arbitration Agreement will control unless the arbitrator determines that the application of the inconsistent Arbitration Agreement terms would not result in a fundamentally fair arbitration.&nbsp; All issues are for the arbitrator to decide, including, but not limited to, issues relating to the scope, enforceability, and arbitrability of this Arbitration Agreement.&nbsp; The arbitrator can award the same damages and relief on an individual basis that a court can award to an individual under this Agreement and applicable law.&nbsp; Decisions by the arbitrator are enforceable in court and may be overturned by a court only for very limited reasons.&nbsp; If Customer’s claim is for $10,000 or less, ServiceTitan agrees that Customer may choose whether the arbitration will be conducted solely on the basis of documents submitted to the arbitrator, through a telephonic hearing or by an in-person hearing as established by the AAA Rules.&nbsp; If Customer’s claim exceeds $10,000, the right to a hearing will be determined by the AAA Rules.&nbsp; Regardless of the manner in which the arbitration is conducted, the arbitrator shall issue a reasoned written decision sufficient to explain the essential findings and conclusions on which the award is based.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">(e) <u>Costs of Arbitration</u>. Payment of all filing, administration, and arbitrator fees (collectively, the “Arbitration Fees”) will be governed by the AAA Rules, unless otherwise provided in this Arbitration Agreement.&nbsp; Any payment of attorneys’ fees will be governed by the AAA Rules.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">(f) <u>Confidentiality</u>. All aspects of the arbitration proceeding, and any ruling, decision, or award by the arbitrator, will be strictly confidential for the benefit of all parties.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">(g) <u>Severability</u>. If a court or the arbitrator decides that any term or provision of this Arbitration Agreement other than clause (b) above is invalid or unenforceable, the parties agree to replace such term or provision with a term or provision that is valid and enforceable and that comes closest to expressing the intention of the invalid or unenforceable term or provision, and this Arbitration Agreement shall be enforceable as so modified.&nbsp; If a court or the arbitrator decides that any of the provisions of clause (b) above are invalid or unenforceable, then the entirety of this Arbitration Agreement shall be null and void.&nbsp; The remainder of the Agreement will continue to apply.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><span class="bold"><b>21.</b></span>&nbsp; <span class="bold"><b>Governing Law</b></span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">The Agreement is governed by the laws of the State of California without regard to conflict of law principles. Subject to Section 20A or 20B, as applicable, you and ServiceTitan hereby irrevocably and unconditionally submit and attorn to the personal and exclusive jurisdiction of the state courts and federal courts located within Los Angeles County, California for resolution of any lawsuit or court proceeding permitted under the Agreement. We operate the Service from our offices in California and offer the Service in the United States and Canada. We make no representation that the Service is appropriate or available for use in other locations. The application of the United Nations Convention on Contracts for the International Sale of Goods is expressly excluded.&nbsp;&nbsp;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><span class="bold"><b>22.</b></span>&nbsp; <span class="bold"><b>Waiver</b></span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">No waiver by any party of any of the provisions of the Agreement will be effective unless explicitly set forth in writing and signed by the party so waiving. Except as otherwise set forth in the Agreement, (i) no failure to exercise, or delay in exercising, any rights, remedy, power, or privilege arising from the Agreement will operate or be construed as a waiver thereof, and (ii) no single or partial exercise of any right, remedy, power, or privilege hereunder will preclude any other or further exercise thereof or the exercise of any other right, remedy, power, or privilege.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><span class="bold"><b>23.</b></span>&nbsp; <span class="bold"><b>Severability</b></span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">If any part of the Agreement is found by a court of competent jurisdiction to be illegal, unenforceable, or invalid, the remaining portions of the Agreement will remain in full force and effect.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><s e Agreement. Without limiting the foregoing, your use of certain ServiceTitan products shall be subject to the product-specific terms and conditions set forth on Attachment 1 hereto, which are incorporated by reference into the Agreement.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><span class="bold"><b>26.</b></span>&nbsp; <span class="bold"><b>Consent to Electronic Communications</b></span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">(a)&nbsp; By using the Service, you consent to receiving certain electronic communications from us as further described in our Privacy Policy and this Section 26. Please read our Privacy Policy to learn more about our electronic communications practices. You agree that any notices, agreements, disclosures, or other communications that we send to you electronically will satisfy any legal communication requirements, including that those communications be in writing.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">(b)&nbsp; By entering into the Agreement, you agree on behalf of yourself and any of your employees and contractors to receive calls and text messages from ServiceTitan and persons acting on our behalf at the telephone numbers you or they provided to us. You understand and agree that these calls and text messages may be made using an autodialer, artificial or prerecorded voice, or other automated technology. These communications may include operational communications concerning your account, communications regarding the Service and marketing communications. Standard text messaging rates will apply. This agreement to receive promotional calls and texts is not a condition of any purchase or of use of the Service.&nbsp;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">(c)&nbsp; We and our Affiliates and third party service providers may also communicate with you by email and push notifications in our Mobile Apps.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">(d)&nbsp; IF YOU WISH TO OPT OUT OF COMMERCIAL EMAILS FROM SERVICETITAN, YOU CAN UNSUBSCRIBE BY FOLLOWING THE UNSUBSCRIBE OPTIONS IN THE EMAIL ITSELF. IF YOU WISH TO OPT OUT OF PROMOTIONAL TEXTS, REPLY “STOP” TO A PROMOTIONAL TEXT OR&nbsp; SEND AN EMAIL TO <a data-optimizely="hyperlink" href="mailto:OPTOUT@SERVICETITAN.COM" target="_blank" rel="noopener noreferrer">OPTOUT@SERVICETITAN.COM</a> WITH THE PHONE NUMBER AND YOUR REQUEST. TO OPT OUT OF PROMOTIONAL CALLS, PLEASE MAKE A DO NOT CALL REQUEST DURING ANY CALL YOU RECEIVE, OR CALL US AT (866) 622-0680.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><span class="bold"><b>27.</b></span>&nbsp; <span class="bold"><b>Notice to California Residents</b></span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">If you are a California resident, under California Civil Code Section 1789.3, you may contact the Complaint Assistance Unit of the Division of Consumer Services of the California Department of Consumer Affairs in writing at 1625 N. Market Blvd., Suite S-202, Sacramento, California 95834, or by telephone at (800) 952-5210 in order to resolve a complaint regarding the Service or to receive further information regarding use of the Service.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><span class="bold"><b>28.</b></span>&nbsp; <span class="bold"><b>International Use; Export Control; Anti-Corruption</b></span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">The Service is intended for use within the United States and Canada. We make no representation or warranty that the Service is appropriate or available for use or will function outside of the United States and Canada. Access to the Service from countries or territories or by individuals where such access is illegal is prohibited. Software available in connection with the Service and the transmission of applicable data, if any, is subject to United States export controls. No software (including the Mobile Apps) may be downloaded from the Service or otherwise exported or re-exported in violation of U.S. export laws. Downloading or using any software (including the Mobile Apps) is at your sole risk. You certify that you are not on any of the relevant U.S. or Canadian government lists of prohibited persons, including the Treasury Department’s List of Specially Designated Nationals and the Commerce Department’s List of Denied Persons or Entity List. You further certify that you will not export, re-export, ship, transfer or otherwise use the ServiceTitan Technology in any country subject to an embargo or other sanction by the United States, including Iran, Syria, Cuba, Sudan, Russia, the Crimea region of Ukraine, and North Korea and that you will not use the ServiceTitan Technology for any purpose prohibited by applicable export laws, including, but not limited to, nuclear, chemical, missile or biological weapons related end uses. You have not received or been offered any illegal or improper bribe, kickback, payment, gift, or thing of value from any of our employees or agents in connection with the Agreement. Reasonable gifts and entertainment provided in the ordinary course of business do not violate the above restriction. If you learn of any violation of the above restriction, you will use reasonable efforts to promptly notify us at <a data-optimizely="hyperlink" href="mailto:legalinquiry@servicetitan.com" target="_blank" rel="noopener noreferrer">legalinquiry@servicetitan.com</a>.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><span class="bold"><b>29. Third-Party Services and Websites</b></span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(a) Third-Party Services</u>. The Service may provide links or other access to services, sites, technology, and resources that are provided or otherwise made available by third parties (each a “<span class="bold"><b>Third-Party Service</b></span>”). Your access and use of Third-Party Services may be subject to additional terms and conditions, privacy policies, or other agreements with such third party, and you may be required to authenticate to or create separate accounts to use Third-Party Services on the websites or via the technology platforms of their respective providers. Certain Third-Party Services will provide us with access to certain information that you have provided to third parties, including through such Third-Party Services, and we will use, store and disclose such information in accordance with our Privacy Policy and/or the DPA, as applicable. In addition, certain Third-Party Services may operate in conjunction with the Service, such as by exchanging data with the Service. For more information about the implications of activating Third-Party Services and our use, storage and disclosure of information related to you and your use of such Third-Party Services within the Service, please see our Privacy Policy. We have no control over and are not responsible for such Third-Party Services, including with respect to the accuracy, availability, reliability, or completeness of information or content generated or shared by, or made available through, such Third-Party Services, or on the privacy practices of Third-Party Services.&nbsp; We encourage you to review the privacy policies of the third parties providing Third-Party Services prior to using such services. You, and not ServiceTitan, will be responsible for any and all costs and charges associated with your use of any Third-Party Services. We enable these Third-Party Services merely as a convenience and the integration or inclusion of such Third-Party Services does not imply an endorsement or recommendation - we do not make any representations or warranties regarding any such Third-Party Services, whether or not such products or services are designated by us as “certified,” “validated,” “supported” or otherwise. Any dealings you have with third parties while using the Service are between you and the third party. We will not be responsible or liable, directly or indirectly, for any damage or loss caused or alleged to be caused by or in connection with use of or reliance on any Third-Party Services. We may terminate the interconnectivity between any Third-Party Service and the Service at any time for any reason, including changes in interoperability requirements, policies or fees charged by such Third-Party Services to ServiceTitan or our customers.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(b) Google Maps</u>. Google Maps presented to you through the Service are powered by Google. Your use of Google Maps is subject to the Google Maps Terms of Service, available online at <u>https://www.google.com/intl/en-US_US/help/terms_maps.html</u>, and <u>https://www.google.com/intl/ALL/policies/privacy/index.html</u>, and by using the Service, you are agreeing to be bound by such terms.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(c) Additional Third-Party Services</u>. Certain additional terms that apply to your use of Third-Party Services within certain features or functionality of the Service are attached to the Agreement. If you access or use those features or functionality, you hereby agree to those additional terms.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><span class="bold"><b>30.</b></span>&nbsp; <span class="bold"><b>Third-Party Distribution Channels</b></span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(a) Distribution Channels</u>. This Section 30 only applies to the extent you are using our Mobile App on a mobile device. ServiceTitan makes available our Mobile App through the Apple App Store, the Google Play Store, or other distribution channels (“<span class="bold"><b>Distribution Channels</b></span>”). If you obtain our Mobile App through a Distribution Channel, you may be subject to additional terms of the Distribution Channel. The Agreement is between you and us only, and not with the Distribution Channel. To the extent that you utilize any other third-party products and services in connection with your use of the Service, you agree to comply with all applicable terms of any agreement for such third-party products and services.<br><br><u>(b) Apple-Enabled Software</u>. With respect to Mobile Apps that are made available for your use in connection with an Apple-branded product, in addition to the other terms and conditions set forth in the Agreement, the following terms and conditions apply. You acknowledge that the Agreement is between you and ServiceTitan only, not with Apple Inc. (“<span class="bold"><b>Apple</b></span>”), and Apple is not responsible for the Mobile App or the content thereof. You may not use the Mobile App in any manner that is in violation of or inconsistent with the “Usage Rules” set forth for the Mobile App in, or otherwise be in conflict with, the Apple Media Services Terms and Conditions. Your license to use the Mobile App is limited to a non-transferable license to use the Mobile App on an iOS product that you own or control, as permitted by the “Usage Rules” set forth in the Apple Media Services Terms and Conditions, except that such Apple-Enabled Software may be accessed and used by other accounts associated with the purchaser via Apple’s Family Sharing or volume purchasing programs. Apple has no obligation to furnish any maintenance and support services with respect to the Mobile App. Apple is not responsible for any product warranties, whether express or implied by law. If the Mobile App fails to conform to any applicable warranty, you may notify Apple and Apple will refund any applicable purchase price for the Mobile App, if any, to you; and, to the maximum extent permitted by applicable law, Apple has no other warranty obligation with respect to the Mobile App, or any other claims, losses, liabilities, damages, costs, or expenses attributable to any failure to conform to any warranty, which will be ServiceTitan’s sole responsibility, to the extent it cannot be disclaimed under applicable law. Apple is not responsible for addressing any claims by you or any third party relating to the Mobile App or your possession and/or use of the Mobile App, including: (a) product liability claims; (b) any claim that the Mobile App fails to conform to any applicable legal or regulatory requirement; or (c) claims arising under consumer protection or similar legislation. Apple is not responsible for the investigation, defense, settlement and discharge of any third party claim that the Mobile App and/or your possession and use of the Mobile App infringe a third party’s intellectual property rights. You agree to comply with any applicable third party terms when using the Mobile App. Apple and Apple’s subsidiaries are third party beneficiaries of the Agreement, and upon your acceptance of the Agreement, Apple will have the right (and will be deemed to have accepted the right) to enforce this Agreement against you as a third party beneficiary of the Agreement. You hereby represent and warrant that: (i) you are not located in a country that is subject to a U.S. Government embargo, or that has been designated by the U.S. Government as a “terrorist supporting” country; and (ii) you are not listed on any U.S. Government list of prohibited or restricted parties. You must comply with applicable third-party terms of agreement when using the Mobile App, e.g., your wireless data service agreement. If you have any questions, complaints, or claims with respect to the Mobile App, they should be directed to us as follows: <a data-optimizely="hyperlink" href="mailto:legalinquiry@servicetitan.com" target="_blank" rel="noopener noreferrer">legalinquiry@servicetitan.com</a>, 855-899-0970, 800 N. Brand Blvd., Ste. 100, Glendale, CA 91203.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6
