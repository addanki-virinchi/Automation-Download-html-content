t forth in the Agreement. No usage of trade or other regular practice or method of dealing between the parties will be used to modify, interpret, supplement, or alter the terms of the Agreement. ServiceTitan will not be bound by, and specifically objects to, any term, condition, or other provision that is different from or in addition to the Agreement (whether or not it would materially alter the Agreement) that is proffered by Customer in any receipt, acceptance, purchase order, confirmation, correspondence, Customer procurement portal or similar location, or otherwise, and all such terms or conditions are hereby rejected and shall be null and void, regardless of whether such purchase order, procurement or order documentation or other documentation is executed by the parties.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><span class="bold"><b>32.</b></span>&nbsp; <span class="bold"><b>U.S. Government Restricted Rights</b></span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">The Service is made available to the U.S. government with “RESTRICTED RIGHTS.” Use, duplication, or disclosure by the U.S. government is subject to the restrictions contained in 48 CFR 52.227-19 and 48 CFR 252.227-7013 et seq. or its successor. Access or use of the Service (including any Mobile App or Ancillary Software) by the U.S. government constitutes acknowledgement of our proprietary rights in the Service (including the Mobile Apps and Ancillary Software).</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><span id="attachment-1">Attachment 1</span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><span class="bold"><b>ADDITIONAL TERMS FOR SERVICETITAN TELEPHONY SERVICES</b></span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(a)</u> If you register to use ServiceTitan’s Phones Pro™ or Contact Center Pro™ services or use other telephony services or functionality within the Service (individually and collectively, the “ServiceTitan Telephony Services”), your use of such services and functionality is subject to these additional terms and conditions.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(b) Upgrades and Downgrades</u><span class="bold"><b>.</b></span>&nbsp; You may upgrade to ServiceTitan Phones Pro or Contact Center Pro at any time during the month. For subscription upgrades to ServiceTitan Phones Pro or Contact Center Pro, you will be charged the prorated difference between the Standard and Advanced license fees for the remainder of the active billing cycle.&nbsp; Additional licenses for these services may be purchased at the same pricing during the term, with fees prorated for partial months, and you may make adjustments in the actual number of licenses from time to time, provided that you must always purchase a number of licenses equal to or greater than the Minimum Subscription Level as defined in your customer success agreement (or other written agreement with us, as applicable).</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(c) Partnerships</u><span class="bold"><b>. </b></span>ServiceTitan Telephony Services require the ongoing disclosure and transmittal of your business and personal information (including Customer Data) to third party subprocessors in order to provide and support such ServiceTitan Telephony Services and you agree to such disclosure and transmittal.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(d) Charges</u><span class="bold"><b>. </b></span>Our charges for ServiceTitan Telephony Services may also include Federal Universal Service, Regulatory and Administrative Charges, and we may also include other charges related to our government costs. Some of these charges are required by law, and others are pass-through charges assessed by ServiceTitan. To the extent permissible by law, ServiceTitan may retain such sums in whole or in part, and may change the amounts assessed and the fees or costs that they cover. An explanation of these charges is available on ServiceTitan’s website and/or Customer’s invoice.&nbsp;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(e) Transcripts</u>. Customer acknowledges that summaries and transcripts generated in connection with Customer’s use of ServiceTitan Telephony Services hereunder shall not be available for download, export or similar data tasks and as a result are not available outside of ServiceTitan Technology.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">(f) With respect to ServiceTitan Telephony Services, North American phone numbers you port into the Service are handled in accordance with either the Federal Communications Commission (FCC) or Canadian Radio-television and Telecommunications Commission (CRTC) “local number portability” (LNP) rules. ServiceTitan ports local and toll-free numbers for Customers to use for call tracking and recording purposes in the Service.&nbsp; Customer will remain the customer of record for any number that the Customer ports to the Service or obtains through the Service and such numbers are eligible to be ported out at any time. ServiceTitan will not attempt to hold or restrict the transfer of any such number or prevent an authorized port. ServiceTitan does not impose any port in or port out fees. You must establish an account with an alternate telephony provider and port your numbers from the Service to your account with such alternate provider prior to the expiration or termination of your ServiceTitan telephony subscriptions (whether basic phones, Phones Pro, or Contact Center Pro); failure to port your phone numbers from the Service to another telephony provider prior to the expiration or termination of the applicable ServiceTitan telephony subscriptions, or such other deadline as we may communicate to you in writing (email acceptable), may result in your permanent loss of such phone numbers.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(g) EMERGENCY CALLING AND 911</u>.&nbsp;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><span class="bold"><b>Limitations of Calls to 9-1-1 and 911 Service</b></span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">This is an explanation of your responsibilities and ServiceTitan Telephony Services limitations regarding emergency calls to 9-1-1 (“911 Service”).&nbsp; The term “911” also includes “Enhanced 911” or “E911,” which is 911 plus some location and call-back functionalities designed to locate callers in an emergency.&nbsp; E911 only works where 911 call centers called Public Safety Answering Points (PSAPs) have installed E911 capable equipment.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">As a prerequisite to using any 911 Service, Canadian customers must also review and agree to the 9-1-1 Terms of Service provided to you by ServiceTitan.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>Your Responsibility to Provide Location Information</u>.&nbsp; As a condition of utilizing ServiceTitan Telephony Services, you must provide the correct physical (civic) address information to ServiceTitan when setting up your Account (hereinafter “Registered Location”). You may update your Registered Location at any time through the Service portal. You are required to keep the Registered Location current and update it whenever you change your location.&nbsp; You are responsible for keeping your Registered Location current and accurate at all times, as well as training any users of your account to update location information as needed.&nbsp; ServiceTitan may rely on whatever location information is available at the time of the call (which may include mobile device geolocation information and/or your Registered Location) to route your call to an appropriate PSAP, and you may be asked for your name, telephone number, and location during an emergency call. You agree that ServiceTitan may, whenever you dial 9-1-1, and without further notice to you, use or disclose personal information, including but not limited to data such as a civic address that you have provided and/or device-based location information (including, but not limited to, horizontal and vertical location coordinates). &nbsp; 	</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>General 911 Service Limitations</u>. You acknowledge that circumstances may cause 911 Service to be limited or unavailable, such as:</p><ul><li><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">&nbsp;network outage,</p></li><li><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">&nbsp;network congestion,</p></li><li><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">&nbsp;power outages or other loss of electrical or battery power,</p></li><li><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">the PSAP’s ability or willingness to receive and respond to an emergency call or text message,</p></li><li><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">&nbsp;the device is not located in the United States of America or Canada, and/or</p></li><li><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">&nbsp;other technical limitations.&nbsp;</p></li></ul><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">You further acknowledge that even though ServiceTitan will make commercially reasonable efforts to route your 911 call to the appropriate 911 emergency dispatch center or PSAP, calls may be routed to a PSAP covering a neighboring or distant area due to incorrect location information supplied by you, inaccurate or unavailable routing information, mechanical failure, and error.&nbsp; When you call 9-1-1, immediately tell the responder where you are (i.e., identify the physical location where you can be found).&nbsp;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">ServiceTitan completes telephone calls using VoIP technology and our telephony services are intended primarily for use within the domestic United States and within Canada. VoIP telephony is fundamentally different from traditional telephone service and has inherent limitations that include, but are not limited to, relocation of end user customer premises equipment, use of a non-native telephone number, broadband connection failure, loss of electrical power, and delays that may occur in making a Registered Location available in or through the Automatic Location Information database used to provide location information to PSAPs.&nbsp;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>Warnings to end users</u>. You must notify end users of ServiceTitan Telephony Services about the 911 limitations of ServiceTitan Telephony Services as outlined in the Agreement. You acknowledge and will complete all advisory notices and certifications received from ServiceTitan Phones regarding 911 service.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>Limitations on Liability</u>. As a provider of emergency communications for purposes of the Federal NET 911 Act, ServiceTitan asserts immunity and other protection from liability under both state and federal law in connection with its provision of 911 dialing service as part of any Internet-based Service. In addition, ServiceTitan disclaims all responsibility for the conduct of local emergency response centers and the national emergency calling center. ServiceTitan does not have any control over any local emergency response center or the national emergency calling center. Therefore, ServiceTitan is not responsible for whether those centers answer calls made using ServiceTitan’s 911 dialing service, how they answer such calls, or how they handle them. ServiceTitan relies on third parties to assist in routing 911 dialing calls to local emergency response centers and/or, to the extent permissible under federal law, to a national emergency calling center. ServiceTitan cannot ensure that your local emergency service provider is capable of handling 911 calls from Internet-based service users. Accordingly, ServiceTitan is neither liable nor responsible if the data used by a third party to route such calls is incorrect or produces an erroneous result. Neither ServiceTitan nor its officers, directors, shareholders, employees, agents or subcontractors may be held liable for any claim, damage, loss, fine, penalty, cost, and/or expense (including, without limitation, any and all attorneys’ fees) by, or on behalf of, any ServiceTitan customer or any third party or user of ServiceTitan’s Service, relating to or arising out of ServiceTitan Telephony Services, including, without limitation, 911 dialing, or any device used in connection with ServiceTitan Telephony Services.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><span class="bold"><b>SERVICETITAN PAYMENTS™ ADDITIONAL TERMS</b></span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">ServiceTitan is an Elavon Payments Partner &amp; Registered Partner/ISO of Elavon, Inc. Georgia a wholly owned subsidiary of U.S. Bancorp, Minneapolis, MN.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">ServiceTitan is an Elavon Payments Partner &amp; Registered Partner/ISO of the Canadian branch of U.S. Bank National Association and Elavon.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(a)</u> Your use of ServiceTitan Payments (“<span class="bold"><b>Payments</b></span>”) is subject to the following additional terms and conditions.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(b)</u><span class="bold"><em><u> </u></em></span><u>PCI DSS Compliance</u>.&nbsp; In the course of using Payments, Customer will have access to and may collect, access, use, store, process, dispose of, or disclose credit, debit, or other payment cardholder information. Customer agrees and acknowledges that Customer shall at all times remain in compliance with Payment Card Industry Data Security Standard ("<span class="bold"><b>PCI DSS</b></span>") requirements, including remaining aware at all times of changes to the PCI DSS and promptly implementing all procedures and practices as may be necessary to remain in compliance with the PCI DSS, in each case, at Customer's sole cost and expense. ServiceTitan agrees and acknowledges that ServiceTitan is responsible as well for the security of cardholder data that we possess or otherwise store, process, or transmit on behalf of the Customer and to the extent that ServiceTitan could impact the security of Customer’s cardholder data environment.&nbsp;&nbsp;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(c) Indemnification</u>. To the fullest extent permitted by law, you are responsible for your use of Payments, and you will defend and indemnify the ServiceTitan Entities from and against every claim brought by a third party, and any related liability, damage, loss, and expense, including reasonable attorneys’ fees and costs, arising out of or connected with your use of Payments, including, for the avoidance of doubt, any expenses for chargebacks, fines or fees for which ServiceTitan becomes liable for or otherwise incurs.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(d) Third Party Processing; Underwriting Requirements</u>. Payments is dependent upon third party payment processors and as a prerequisite to your use of Payments, you must enter into agreements directly with such third party payment processors and successfully complete the applicable underwriting processes. Your use of Payments is subject to the approval (and ongoing underwriting) of such third party payment processors in their sole discretion and subject to the terms, conditions, policies, limitations, and other requirements imposed by them from time to time.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><span class="bold"><b>PRICEBOOK PRO™ ADDITIONAL TERMS</b></span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(a)</u> Your use of ServiceTitan’s Pricebook Pro service (“<span class="bold"><b>Pricebook Pro</b></span>”) is subject to the following additional terms and conditions.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(b) Restrictions on Pricebook Pro Content</u>. You will not distribute, communicate, rent, lease or otherwise transfer the Pricebook Pro Content (other than Your Content through the ServiceTitan Service) to any third parties. You will not remove, modify, or obscure any ServiceTitan or third party proprietary rights notices embedded in the Pricebook Pro Content.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(c) Termination</u>. Upon termination of your Pricebook Pro subscription, ServiceTitan will allow you to access Your Content for a limited period of thirty (30) days for the purpose of removing ServiceTitan-provided content from Your Content. Subject to Section 5(e) above and ServiceTitan’s agreement that all ServiceTitan-provided content (or content derived from ServiceTitan-provided content) has been removed from Your Content, ServiceTitan will then permit you to export Your Content from Pricebook Pro.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><span class="bold"><b>MARKETING PRO™ ADDITIONAL TERMS</b></span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">Your use of ServiceTitan’s Marketing Pro service (“<span class="bold"><b>Marketing Pro</b></span>”) is subject to the following additional terms and conditions.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(a)&nbsp; Fees for Marketing Pro</u><span class="bold"><b>.</b></span> The fees you will pay for ServiceTitan Marketing Pro will depend on the number of email contacts in your Marketing Pro account, the number and types of direct mail pieces you order and the individual features you subscribe for and use. Per piece fees will be charged periodically. Marketing Pro fees are billed in arrears at the end of each monthly billing period based on the usage and tier of service as of the billing date. All fees paid hereunder are non-refundable and non-recoupable (including with respect to any returned mail pieces).</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(b) Compliance with Law</u><span class="bold"><b>. </b></span>You represent and warrant that your access to and use of Marketing Pro will comply with all applicable laws, rules and regulations, including but not limited to those that relate to privacy and data protection and to the sending of electronic communications. You further represent and warrant that you have a lawful basis for processing and sending Your Content and communications to your customers, business contacts or followers who consent to receiving marketing or promotional messages from you or on your behalf (“<span class="bold"><b>Contacts</b></span>”), whether through legally appropriate express consents or otherwise. When using the ServiceTitan Service, you may import data, including personally identifiable information, regarding your Contacts (“<span class="bold"><b>Contact Data</b></span>”). You will not provide ServiceTitan or upload to Marketing Pro, or take any actions with respect to, any of Your Content or Contact Data for which you do not have a lawful basis for processing, permissions or consents in accordance with applicable privacy and data protection laws, nor information that is illegal or inappropriate. ServiceTitan reserves the right to remove illegal or inappropriate content. You (and not ServiceTitan) are responsible for ensuring that you meet all legal obligations (including notice, consent, and prescribed information and unsubscribe mechanisms) for sending communications to individuals in the jurisdictions where they reside. While Marketing Pro allows you to manage and access consents and other Contact Data, you acknowledge and agree that you, and not ServiceTitan, have sole responsibility for maintaining all records relating thereto. You are solely responsible for determining whether Marketing Pro is suitable for use in light of any laws and regulations that govern your entity, industry, or relationship with your own Contacts, including but not limited to consumer protection, anti-spam, privacy, advertising, intellectual property or other laws. You may not use Marketing Pro for any unlawful or discriminatory activities, including acts prohibited by the Federal Trade Commission Act, Fair Credit Reporting Act, Equal Credit Opportunity Act, the Canadian Competition Act, Canada’s Anti-Spam Legislation, any Canadian Human Rights Code, or other laws that apply to commerce. The guidelines below are examples of practices that may violate the Agreement or applicable law when generating or sending commercial electronic messages (“<span class="bold"><b>Emails</b></span>”) through Marketing Pro:</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">a.&nbsp; Using non-permission based Email lists (i.e., lists in which each recipient has not explicitly granted permission to receive Emails from you by affirmatively opting-in to receive those Emails);</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">b.&nbsp; Using purchased or rented Email lists;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">c.&nbsp; Using third party email addresses, domain names, or mail servers without proper permission;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">d.&nbsp; Sending Emails to non-specific addresses (e.g., webmaster@domain.com or info@domain.com);</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">e. Sending Emails that result in an unacceptable number of spam or Unsolicited Commercial email (UCE) complaints (even if the Emails themselves are not actually spam or UCE);</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">f. Failing to include a working “unsubscribe” link in each Email that allows the recipient to remove themselves from your mailing list;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">g. Failing to comply with any request from a recipient to be removed from your mailing list within 10 days of receipt of the request;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">h. Failing to include in each Email a link to the then-current privacy policy applicable to that Email;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">i. Disguising the origin or subject matter of any Email or falsifying or manipulating the originating email address, subject line, headers, or transmission path information for any Email;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">j. Failing to include in each Email your valid physical mailing address or a link to that information; and</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">k. Including “junk mail,” “chain letters,” “pyramid schemes,” incentives (e.g., coupons, discounts, awards, or other incentives) or other material in any Email that encourages a recipient to forward the Email to another recipient.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(d) Third Party Data</u>. Certain functions and features of Marketing Pro make use of data licensed from or owned by third parties (“<span class="bold"><b>Third Party Data</b></span>”). ServiceTitan may charge incremental fees in connection with your access to such Third Party Data.&nbsp; You may use this Third Party Data solely in connection with your use of Marketing Pro and for internal analysis, and you shall not use any such Third Party Data for reproduction, sale, publication, or any other use in relation to any product or service to be provided to any third party, or any other commercial exploitation except as expressly consented to in writing by ServiceTitan. Third Party Data remains the property of its owner, and you will not acquire any proprietary rights in or to the Third Party Data, and you acknowledge that the Third Party Data is a valuable commercial product, the development of which has involved the expenditure of substantial time and money. You acknowledge that some Third Party Data is sourced from public documents or statistical calculations, that all Third Party Data is provided on an “as is, as available” basis with all faults and defects, and that neither the owner/licensee of such Third Party Data nor ServiceTitan makes any warranties, express or implied, including without limitation, those of merchantability and fitness for a particular purpose. Further, neither owner/licensee of such Third Party Data nor ServiceTitan are responsible for errors, omissions, miscalculations, or misrepresentations of value. Any use of or reliance on Third Party Data by you is at your own risk.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><u>(e) Termination</u>. Upon termination of your Marketing Pro subscription, ServiceTitan will allow you to access Your Content for a limited period of 30 days for the purpose of removing all ServiceTitan-provided content from Your Content. Subject to Section 5(e) above and ServiceTitan’s agreement that all ServiceTitan-provided content (or content derived from ServiceTitan-provided content) has been removed from Your Content, ServiceTitan will then permit you to export Your Content from Marketing Pro.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><span class="bold"><b>FLEET PRO™ ADDITIONAL TERMS</b></span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">Your use of ServiceTitan’s Fleet Pro service is subject to the following additional terms and conditions.</p><ol><li><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">Fleet Pro is powered by Azuga, Inc. (“Azuga”), and your purchase or lease of any hardware (including any GPS-enabled wireless data communication hardware) sourced from Azuga (“Azuga Hardware”), as well as your use of the services provided by Azuga (“Azuga Services”), are subject in all respects to the Azuga terms and conditions located here: <a data-optimizely="hyperlink" href="https://www.azuga.com/eula/" target="_blank" rel="noopener noreferrer">https://www.azuga.com/eula/</a> (the “Azuga Terms”). By subscribing to Fleet Pro, and/or ordering any Azuga Hardware, you acknowledge and agree to the Azuga Terms.</p></li><li><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">You acknowledge and agree that you will, as a prerequisite to your use of Fleet Pro and any Azuga Hardware or Azuga Services, read and express your assent to the Azuga Terms in the manner specified therein. The Azuga Terms are subject to amendment from time to time in Azuga’s sole discretion and without notice to you. You are responsible for regularly reviewing the latest version of the Azuga Terms and any continued use of the Azuga Hardware or Azuga Services following an amendment to the Azuga Terms will constitute your acceptance of such amended Azuga Terms. By subscribing to or otherwise using Fleet Pro, you expressly agree to the transmittal and sharing of your data, including Customer Data, between Azuga and ServiceTitan. Any and all data received by ServiceTitan from Azuga in connection with your use of Fleet Pro constitutes Customer Data.</p></li><li><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">The Azuga Hardware is manufactured by or on behalf of Azuga, and not ServiceTitan. Azuga Hardware and Azuga Services are not covered by any of the representations or warranties set forth in these Terms of Use or any agreement you have in place with ServiceTitan, including without limitation any service level agreement; such Azuga Hardware is covered only by the Azuga Terms and any warranties made by Azuga therein. The Azuga Hardware and Azuga Services and any claims related thereto are expressly excluded from any and all of ServiceTitan’s indemnification obligations under any agreement in place between you and ServiceTitan.&nbsp;</p></li><li><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">SERVICETITAN MAKES NO REPRESENTATIONS OR WARRANTIES WHATSOEVER WITH RESPECT TO THE AZUGA HARDWARE OR AZUGA SERVICES, WHETHER EXPRESS, IMPLIED, OR STATUTORY, INCLUDING, WITHOUT LIMITATION, ANY (a) WARRANTY OF MERCHANTABILITY; (b) WARRANTY OF FITNESS FOR A PARTICULAR PURPOSE; (c) WARRANTY OF TITLE; AND/OR (d) WARRANTY AGAINST INFRINGEMENT OF INTELLECTUAL PROPERTY RIGHTS OF A THIRD PARTY; WHETHER ARISING BY LAW, COURSE OF DEALING, COURSE OF PERFORMANCE, USAGE OF TRADE, OR OTHERWISE. CUSTOMER ACKNOWLEDGES THAT IT HAS NOT RELIED UPON ANY REPRESENTATION OR WARRANTY MADE BY SERVICETITAN, OR ANY OTHER PERSON ON SERVICETITAN’S BEHALF. THE AZUGA HARDWARE AND AZUGA SERVICES ARE PROVIDED HEREUNDER ON AN “AS-IS” AND WITH ALL FAULTS BASIS. CUSTOMER ACKNOWLEDGES AND AGREES THAT CUSTOMER’S USE OF AZUGA HARDWARE AND AZUGA SERVICES IS AT CUSTOMER’S OWN DISCRETION AND RISK.</p></li><li><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">Customer represents and warrants that (i) it has the necessary right and authority to disclose and allow for the recording of all data and information disclosed, provided to, retrieved or observed by Azuga and/or ServiceTitan with respect to the Azuga Services and Fleet Pro; (ii) Customer has complied with all applicable laws and regulations regarding such disclosures and recordings; (iii) all data and information disclosed or provided to ServiceTitan and/or Azuga by Customer hereunder with respect to the Azuga Services and Fleet Pro will comply with all applicable laws, and will not infringe the copyright, trade secret, privacy, publicity, or other rights of any third party; and (iv) Customer shall not disclose, license, publish, disseminate, transfer, lease, or otherwise make available any audiovisual or other data related to the Azuga Services and Fleet Pro unless Customer has all necessary right and authority to take such action. Customer shall obtain all requisite approvals and authorizations from its personnel for any purpose necessary in connection with the creation, display, analysis and distribution of all data collected hereunder with respect to Fleet Pro and the Azuga Services.</p></li><li><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">To the fullest extent permitted by law, you are responsible for your use of Fleet Pro, and you must ensure that you comply with all applicable laws, rules, and regulations in connection therewith, including without limitation all applicable privacy laws in connection with your collection and use of data in connection with Fleet Pro, and your installation and mounting of any Fleet Pro hardware in a vehicle. You agree to defend and indemnify the ServiceTitan Entities from and against every claim brought by a third party, and any related liability, damage, loss, and expense, including reasonable attorneys’ fees and costs, arising out of or connected with your use of Fleet Pro, including, without limitation, any claims alleging that you failed to comply with all applicable laws, rules and regulations, including those relating to privacy.</p></li><li><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">Warranty claims with respect to the Azuga Hardware must be made per the process set forth in the Knowledge Base or as otherwise instructed by ServiceTitan.</p></li></ol><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><span class="bold"><b>SCHEDULE ENGINE™ LIVE SERVICES ADDITIONAL TERMS</b></span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">Your use of Schedule Engine Live Services is subject to the following additional terms and conditions.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">1.&nbsp;<u>Definitions</u>. When used in these Schedule Engine Additional Terms, the following terms shall have the meanings ascribed to them below:</p><ul><li><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">"<span class="bold"><b>Billable Chat</b></span>" means a Live Chat that (i) lasts at least 1 minute, and (ii) is not marked as spam at the reasonable discretion of ServiceTitan personnel.</p></li><li><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">"<span class="bold"><b>Billable Minute</b></span>" means a minute or fraction thereof during which a ServiceTitan agent is engaged in providing Live Voice Services to Customer or Customer’s customer and not engaged in activities not considered billable in accordance herewith and with applicable Documentation.</p></li><li><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">"<span class="bold"><b>Booking</b></span>" means a segment of time determined by Customer and/or ServiceTitan in applicable documentation and scheduling availability during which Customer has availability and is scheduled by ServiceTitan personnel via the Schedule Engine Services or otherwise to provide services to a given Customer.</p></li><li><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">"<span class="bold"><b>Emergency</b></span>" means an issue or circumstance communicated by Customer's customer that in Customer's determination or ServiceTitan's reasonable discretion requires immediate or high priority attention.</p></li><li><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">"<span class="bold"><b>Escalations</b></span>" means a Schedule Engine Service by which ServiceTitan personnel receive and answer telephone calls from Customer's customer on behalf of Customer during the dates and times agreed upon by ServiceTitan and Customer from time to time for the purposes of (i) determining whether Customer is experiencing an Emergency, and (ii) follow Customer's Emergency escalation protocols as determined by ServiceTitan and Customer in accordance with applicable documentation.</p></li><li><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">"<span class="bold"><b>Live Chat</b></span>" means a Schedule Engine Service by which ServiceTitan personnel receive and answer electronic messages from Customer's customers on behalf of Customer via Schedule Engine Services available in Customer's websites for the purposes of (i) providing limited customer service in accordance with applicable documentation, (ii) generating and/or requesting Bookings in Customer's dispatch systems or via available Integration or means of communication as set forth in the applicable documentation.</p></li><li><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">"<span class="bold"><b>Live Voice</b></span>" means a Schedule Engine Service by which ServiceTitan personnel receive and answer telephone calls from Customer's customers on behalf of Customer during the dates and times agreed upon by ServiceTitan and Customer from time to time for the purposes of (i) providing limited customer service to Customers in accordance with applicable documentation, (ii) generating and/or requesting Bookings in Customer's dispatch systems or via available Integrations or means of communication as set forth in the applicable documentation.</p></li><li><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">"<span class="bold"><b>Metered Service</b></span>" means a Schedule Engine Service that is provided by ServiceTitan to Customer on a metered basis and for which Customer is charged a per-usage fee at the applicable rates for the corresponding billing period.</p></li></ul><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">2.&nbsp;<u>Live Services</u>. This Section governs the provision of the following Services provided by ServiceTitan to Customer: Live Chat, Live Voice and Emergency Escalation (as each is defined above and which may be referred to as the "Live Services").</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">2.1 <u>ServiceTitan Obligations</u>. ServiceTitan shall provide the Live Services selected in the customer success agreements and/or Order Forms to which this Section refers, provided that Customer (i) has requested and/or activated any such Live Services via the Schedule Engine Services in accordance with the documentation, (ii) has provided the required Customer Content and any other information set forth in applicable documentation, (iii) has activated the necessary features and services in Customer's systems that will allow ServiceTitan to provide the Schedule Engine Services in accordance herewith and with applicable documentation, (iv) has paid all applicable implementation fees, and (v) is not otherwise in default of any of its payment obligations or other obligations under the Agreement.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">2.2 <u>Fees</u>.<br><br><u>a) Metered Services</u>. Customer acknowledges that all Schedule Engine Services which this Section governs are Metered Services. Accordingly, Customer will receive a bill following each billing period with detailed information for each activated Service for which fees were generated in accordance with the relevant customer success agreement and/or Order Form.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">b) <u>Live Voice Wrap-up Time</u>. Each Live Voice call received and answered by ServiceTitan shall include an additional 1.5 Billable Minutes after such call to allow for the applicable ServiceTitan agent to complete the necessary notes for Customer's records and finalize the call records.<br><br><u>c) Tiered Billing</u>.&nbsp;If applicable, Metered Services to which this Section refers shall be billed in tiers at the price per measurable unit set forth in the Order Form which corresponds to the number of measurable units that fall within a given tier, for the applicable billing period.<br><br><u>3. Field User Update; Audit</u>. If Customer has subscribed to the Schedule Engine Services only and does not have corresponding ServiceTitan Field User subscriptions, Customer agrees to notify ServiceTitan within 14 days if the number of Customer's Field Users changes in a manner such that Customer's Schedule Engine subscription fees will change in accordance with the applicable customer success agreement and/or Order Forms. Failure to do so may result in, at ServiceTitan's election, back-billing of Customer for due and unpaid Schedule Engine subscription fees from the date at which ServiceTitan reasonably believes that Customer's Schedule Engine subscription fees changed due to a change in the number of Field Users. Without limiting the foregoing, on thirty (30) days' prior written notice, during the Subscription Term (including any Additional Term), ServiceTitan or its representatives may at its own expense audit and copy from Customer's books, records, and other documents to verify Customer's Field User count hereunder. ServiceTitan may conduct any audit under this Section at any time during Customer's regular business hours on business days, remotely or at Customer's principal place of business and shall not unreasonably interfere with Customer's course of business; provided, however, that ServiceTitan shall not exercise its audit rights under this Section more than once per twelve (12) month period. If any audit under this Section reveals Customer's past under-reporting of Field Users under the Agreement, then Customer must correct such underpayment by paying ServiceTitan all sums determined to be due under this Section in full within thirty (30) days after receiving a written report and substantiation of the inaccuracy.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><span class="bold"><b>SALES PRO™ ADDITIONAL TERMS</b></span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">Your use of ServiceTitan’s Sales Pro service is subject to the following additional terms and conditions.</p><ol><li><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">Certain features and functionality of Sales Pro are powered by Siro Technologies, Inc. (“Siro,” and such features and functionality, the “Siro Features”), and your use of the Siro Features is subject in all respects to the Siro terms and conditions (<a data-optimizely="hyperlink" href="https://www.siro.ai/terms-of-service" target="_blank" rel="noopener noreferrer">https://www.siro.ai/terms-of-service</a>) and privacy policy&nbsp; (<a data-optimizely="hyperlink" href="https://www.siro.ai/privacy-policy" target="_blank" rel="noopener noreferrer">https://www.siro.ai/privacy-policy</a>) (collectively, “Siro Terms”). By subscribing to Sales Pro, you acknowledge and agree to the Siro Terms, and you expressly agree to the transmittal and sharing of your data, including Customer Data, between Siro and ServiceTitan. Any and all data received by ServiceTitan from Siro in connection with your use of Sales Pro constitutes Customer Data. Siro is solely responsible for the Siro Features and such Siro Features are expressly excluded from any and all of ServiceTitan’s indemnification obligations under any agreement in place between you and ServiceTitan.</p></li><li><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">SERVICETITAN MAKES NO REPRESENTATIONS OR WARRANTIES WHATSOEVER WITH RESPECT TO THE SIRO FEATURES (DEFINED ABOVE all applicable laws, rules, and regulations regarding such disclosures and recordings, and have and will ensure Valid Consent for each and every Sales Pro Recording; (iii) all data and information disclosed or provided to ServiceTitan and/or Siro by you hereunder with respect to the Siro Features and/or Sales Pro will comply with all applicable laws, and will not infringe the copyright, trade secret, privacy, publicity, or other rights of any third party; and (iv) you shall not disclose, license, publish, disseminate, transfer, lease, or otherwise make available any audio or other data related to the Siro Features or Sales Pro unless you have all necessary right and authority to take such action.&nbsp;</p></li><li><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">You agree to defend, indemnify, and hold harmless the ServiceTitan Entities from and against every claim brought by a third party, and any related liability, damage, loss, and expense, including reasonable attorneys’ fees and costs, arising out of or connected with your use of Sales Pro, including, without limitation, any claims alleging that you failed to comply with all applicable laws, rules and regulations, including those relating to privacy and/or the recording of conversations.</p></li></ol><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc"><span class="bold"><b>CONVEX PRO™ ADDITIONAL TERMS</b></span></p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">1.&nbsp;Definitions. When used in these Convex Pro Additional Terms, the following terms shall have the meanings ascribed to them below:</p><ul><li><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">"Bulk Format" means an instance where Customer accesses any data or information within the Convex Pro Service related to greater than ten thousand (10,000) parcels of real property per day.</p></li><li><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">"Convex Pro Service" means the online, web-based commercial services, sales and workflow&nbsp;service provided via <a data-optimizely="hyperlink" href="http://atlas.convexlabs.io/" target="_blank" rel="noopener noreferrer">http://atlas.convexlabs.io</a>&nbsp;and/or other designated websites (each a “Convex Pro Website” and collectively, the “Convex Pro Websites”) together with associated offline components such as training, professional services and support services, in each case as identified in an Order Form. For clarity, the Convex Pro Service shall also be deemed a “Service” and “ServiceTitan Technology” under the Agreement.&nbsp;</p></li><li><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">“Convex Pro Users” means Customer’s employees or contractors authorized by Customer to use the Convex Pro Service that have been assigned user identifications and passwords to access the Convex Pro Service.</p></li><li><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">“User Data” means data or information submitted to or otherwise made available by a User to the Convex Pro Service.</p></li></ul><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">2. Convex Pro Support Policy and Terms.&nbsp; ServiceTitan or its Affiliates will provide technical support to Customer with respect to the Convex Pro Service via both telephone and email on weekdays during the hours of 9:00am through 5:00pm Pacific Time, with the exclusion of federal holidays (“Support Hours”). Customer may initiate a helpdesk ticket during Support Hours by calling (415) 915-4220 or at any time by emailing <a data-optimizely="hyperlink" href="mailto:support@convexlabs.io" target="_blank" rel="noopener noreferrer">support@convexlabs.io</a>. ServiceTitan or its Affiliates will use commercially reasonable efforts to respond to all helpdesk tickets within one (1) business day.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">3. Convex Pro Users.&nbsp; Customer may grant access to the Convex Pro Service only to the quantity and type of Convex Pro Users specified in the Order Form and only for the Subscription Term and/or Additional Term (each as defined in the Order Form) applicable to such Convex Pro Users specified therein. Individual Convex Pro User subscriptions shall not be shared or used by more than one Convex Pro User.&nbsp;&nbsp;For the avoidance of doubt, the foregoing Convex Pro User restrictions apply not only to access to the Convex Pro Service, but also the information produced by or made available through the Convex Pro Service, excluding Customer Data (the “Service Generated Information”).&nbsp; Thus, authorized Convex Pro Users shall not share any Service Generated Information with anyone who is not also an authorized Convex Pro User. Any violation of this Section 3 by Customer, its Affiliates or any of its Convex Pro Users shall be a material breach of the Agreement. ServiceTitan or its Affiliates will terminate a particular Convex Pro User’s access to User Data via the Convex Pro Service upon the written request of Customer.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">4. Customer Responsibilities.&nbsp; Customer is responsible for all activities that occur under Convex Pro User accounts and is responsible for ensuring that all use of the Convex Pro Service by its Convex Pro Users complies with the terms of the Agreement.&nbsp; Customer shall: (a) have sole responsibility for the accuracy, quality, integrity, legality, reliability, and appropriateness of all Customer Data; and (b) prevent unauthorized access to, or use of, the Convex Pro Service and the Service Generated Information, and notify ServiceTitan promptly of any such unauthorized use.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">5. Use Restrictions.&nbsp;Customer shall use the Convex Pro Service solely for its internal business purposes in accordance with the Agreement, including in accordance with any field restrictions, regional data restrictions, Convex Pro User restrictions and any other terms set forth herein and in the applicable Order Forms.&nbsp; In addition to the other restrictions set forth in the Agreement, including without limitation those set forth in Section 7 (Compliance with Law; Restrictions), Customer shall not, and shall ensure Convex Pro Users do not:&nbsp; (a) access, disclose, deliver, disseminate or reproduce or distribute any information on the Convex Pro Service in Bulk Format; or (b) use the Convex Pro Service or content found on the Service: (1) as a factor in establishing an individual’s eligibility for credit or insurance, (2) in connection with underwriting individual insurance, (3) in evaluating an individual for employment purposes, (4) in connection with a determination of an individual’s eligibility for a license or other benefit granted by a governmental authority, (5) in any way that would cause the information to constitute a “consumer report” under the Fair Credit Reporting Act, 15 U.S.C. § 1681 et seq., or (6) in any other manner that would cause such use to be construed as a consumer report by any governmental authority.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">6. Proprietary Rights.&nbsp; The Convex Pro Service includes, without limitation, (i) audio and visual information, documents, data, software and other content and works of authorship, including training materials, displayed or otherwise available via the Convex Pro Service or developed in connection with any professional services provided to Customer with respect to the Convex Pro Service; and (ii) other technology, including graphical user interfaces, workflows, products, processes, algorithms, know-how and other trade secrets, techniques, designs, inventions and other tangible or intangible technical material or information contained in or used to provide the Convex Pro Service, all of which constitute ServiceTitan Technology under the Agreement.&nbsp;</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">7.&nbsp; Data Broker Laws.&nbsp; ServiceTitan hereby represents and warrants that it complies with applicable laws regarding data broker registration requirements and honoring opt out rights thereto with respect to any personal data or personal information it processes that is subject to such laws.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">8. Personal Data Shared with Customer.&nbsp; To the extent that ServiceTitan or its Affiliates make available to Customer personal information subject to the California Consumer Privacy Act (“ST Provided Personal Data”), as amended (“CCPA”) via the Convex Pro Service, Customer will, in connection with its processing of such ST Provided Personal Data: (a) comply with applicable obligations under the CCPA and provide the same level of privacy protection as is required by the CCPA; (b) notify ServiceTitan if Customer makes a determination that it can no longer meet its obligations under the CCPA; (c) not use such ST Provided Personal Data for any purpose other than for its legitimate business purposes for which it is provided under the Agreement (unless Customer has received appropriate consent under applicable laws from the individual about whom the ST Provided Personal Data relates to process the ST Provided Personal Data for other purposes), (d) grant ServiceTitan and its Affiliates the right to take reasonable and&nbsp; appropriate steps to help ensure that Customer uses such ST Provided Personal Data in a manner consistent with ServiceTitan and its Affiliates’ obligations under the CCPA and stop and remediate any unauthorized use of the ST Provided Personal Data; (e) provide any required disclosures, such as privacy policies, notices at collection, or opt out notices to individuals whose ST Provided Personal Data it processes; (f) notify ServiceTitan promptly if it makes a determination that it can no longer meet its obligations under applicable laws; and (g) implement appropriate technical and organizational measures to ensure a level of security for the ST Provided Personal Data appropriate to the risk.&nbsp; If required under applicable law, Customer also agrees to comply with any opt out request made by a consumer to ServiceTitan or its Affiliates upon ServiceTitan’s notice to Customer of such request.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">9. Data Sources.&nbsp; THE CONVEX PRO SERVICE MAY CONTAIN DATA RECEIVED FROM THIRD PARTIES (“THIRD PARTY DATA”), INCLUDING, BUT NOT LIMITED TO, LOCAL GOVERNMENTS.&nbsp; CUSTOMER RECOGNIZES THAT SERVICETITAN AND ITS AFFILIATES, AND THEIR RESPECTIVE LICENSORS AND SUPPLIERS, ARE NOT RESPONSIBLE FOR ANY INACCURACIES OR OMISSIONS IN THE THIRD PARTY DATA, AND UNDERSTANDS THAT ANY FACTUAL ERRORS IN THE THIRD PARTY DATA SHOULD BE CORRECTED BY CONTACTING THE APPLICABLE THIRD PARTY AUTHORITY. CUSTOMER FURTHER UNDERSTANDS THAT SERVICETITAN AND ITS AFFILIATES, AND THEIR RESPECTIVE LICENSORS AND SUPPLIERS, AS APPLICABLE, HAVE NO AUTHORITY AND NO ABILITY TO CORRECT SUCH ERRORS OR OMISSIONS. NO CHANGES CAN APPEAR IN THE THIRD PARTY DATA UNLESS AND UNTIL THE APPLICABLE THIRD PARTY AUTHORITY MAKES THEM. CUSTOMER AGREES TO RELEASE AND HOLD HARMLESS ALL GOVERNMENTAL AUTHORITIES FROM ANY INACCURATE DATA SUPPLIED BY THEM FOR INCLUSION IN THE SERVICE. IN THE EVENT ANY PROVIDERS OF THIRD PARTY DATA CEASE TO MAKE SUCH DATA OR ANY DATA ELEMENTS THEREIN AVAILABLE TO SERVICETITAN AND ITS AFFILIATES, OR IN THE EVENT THAT SERVICETITAN OR ITS AFFILIATES ARE REQUIRED TO DELETE OR REMOVE CERTAIN DATA FROM THE SERVICES BASED ON OPT OUT OR DELETION RIGHTS EXERCISED UNDER APPLICABLE LAWS,&nbsp; SUCH THIRD-PARTY DATA OR DATA ELEMENTS THEREIN SHALL CEASE TO BE AVAILABLE VIA THE SERVICE. THIRD-PARTY DATA THAT MAY BE AVAILABLE VIA THE CONVEX PRO SERVICE AT A CERTAIN TIME OR TIMES DURING THE APPLICABLE SUBSCRIPTION TERM AND/OR ADDITIONAL TERM IS NOT GUARANTEED TO REMAIN AVAILABLE FOR THE ENTIRETY OF SUCH SUBSCRIPTION TERM AND/OR ADDITIONAL TERM. THERE ARE MANY REASONS FOR FAILING INSPECTIONS AND DATA ON FAILURE RATES IS NOT NECESSARILY A RELIABLE INDICATOR OF ANY CONTRACTOR’S QUALIFICATIONS OR ABILITY.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" aligndesktop="Left" alignmobile="Left" class="Text__PStyled-sc-10oaj6j-6 riMlc">10. Customer Compliance with Laws.&nbsp; CUSTOMER ACKNOWLEDGES AND AGREES THAT IT IS SOLELY RESPONSIBLE FOR COMPLYING WITH, AND WARRANTS THAT ITS USE OF CONVEX PRO TECHNOLOGY, INCLUDING THE SERVICE, ANY DERIVATIVES THEREOF AND ANY DATA PROVIDED TO IT BY SERVICETITAN, ITS AFFILIATES, AND THEIR RESPECTIVE LICENSORS OR SUPPLIERS WILL COMPLY WITH, ALL APPLICABLE FOREIGN, FEDERAL, STATE AND LOCAL LAWS, REGULATIONS AND ORDINANCES, INCLUDING, WITHOUT LIMITATION THE FAIR CREDIT REPORTING ACT (15 U.S.C. § 1681 ET SEQ.), THE UNITED STATES FREEDOM OF INFORMATION ACT, ALL PRIVACY RELATED LAWS AND REGULATIONS AND ALL OTHER FREEDOM OF INFORMATION, OPEN RECORDS, SUNSHINE AND OTHER SIMILAR LAWS AND REGULATIONS (COLLECTIVELY, THE “APPLICABLE LAWS”).&nbsp; CUSTOMER FURTHER ACKNOWLEDGES AND AGREES THAT IN NO EVENT SHALL SERVICETITAN, ITS AFFILIATES, OR THEIR RESPECTIVE LICENSORS OR SUPPLIERS, BE LIABLE OR RESPONSIBLE FOR CUSTOMER’S FAILURE TO COMPLY WITH ANY APPLICABLE LAWS.&nbsp; WITHOUT LIMITING THE FOREGOING, CUSTOMER ACKNOWLEDGES AND UNDERSTANDS THAT CERTAIN RESTRICTIONS APPLY TO THE USE OF DATA OBTAINED FROM FEDERAL, STATE AND LOCAL GOVERNMENTS AND AGENCIES AND CUSTOMER AGREES TO COMPLY WITH SUCH RESTRICTIONS.&nbsp; CUSTOMER ACKNOWLEDGES AND AGREES THAT THE DATA PROVIDED BY SERVICETITAN, ITS AFFILIATES, AND THEIR RESPECTIVE LICENSORS AND SUPPLIERS VIA THE CONVEX PRO SERVICE RELATES SOLELY TO REAL PROPERTY, DOES NOT RELATE TO ANY INDIVIDUAL CONSUMER, AND THAT CUSTOMER CANNOT IDENTIFY ANY CONSUMER BASED ON A SEARCH OF THE DATABASE IN THE CONVEX PRO SERVICE.</p><p __typename="ContentfulRichText" contentful_id="1eHRzPoGdD5c0MtoQgLbAL" updatedat="2025-03-14T01:18:33.673Z" ali
